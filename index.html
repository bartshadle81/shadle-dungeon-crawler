async function submitRiddleAnswer() {
  const me = (fbState.players||{})[myId];
  if (!me || me.choiceSubmitted) return;
  const input = document.getElementById('riddleInput');
  if (!input) return;
  const answer = input.value.trim().toLowerCase();
  if (!answer) return;

  const scData = SCENES[8];
  const correct = scData.getAnswer(me.archetype);
  const isRight = answer === correct;

  const upd = {
    [`players/${myId}/choice`]:          isRight ? `Answered correctly: "${input.value.trim()}"` : `Answered: "${input.value.trim()}"`,
    [`players/${myId}/choiceId`]:        isRight ? 'correct' : 'wrong',
    [`players/${myId}/choiceSubmitted`]: true,
  };
  await ROOT.update(upd);
  playChoiceSound();

  // Check if all have submitted
  ROOT.once('value', snap => {
    const s = snap.val() || {};
    const ps = s.players || {};
    const allDone = Object.values(ps).every(p => p.status === 'downed' || p.choiceSubmitted);
    if (!allDone) return;

    // Check if all answered correctly
    const allCorrect = Object.entries(ps).every(([id, p]) => {
      if (p.status === 'downed') return true;
      return p.choiceId === 'correct';
    });

    if (allCorrect) {
      // Door opens — write solved state and advance
      const attempts = s.riddleAttempts || 0;
      ROOT.update({ riddleSolved: true, 'session/phase': 'waiting_for_narration' });
    } else {
      // Wrong answer — apply damage, increment attempts, reset submissions
      const attempts = (s.riddleAttempts || 0) + 1;
      const resetUpd = { riddleAttempts: attempts, 'session/phase': 'choosing' };
      Object.keys(ps).forEach(id => {
        resetUpd[`players/${id}/choiceSubmitted`] = false;
        resetUpd[`players/${id}/choice`] = null;
        resetUpd[`players/${id}/choiceId`] = null;
      });
      if (attempts >= 2) {
        // Used all attempts — fire narration anyway (bad track)
        resetUpd['session/phase'] = 'waiting_for_narration';
      } else {
        // Apply 8 damage immediately so bars update
        Object.keys(ps).filter(id => ps[id].status === 'active').forEach(id => {
          const newHp = Math.max(0, (ps[id].hp || 0) - 8);
          resetUpd[`players/${id}/hp`] = newHp;
          if (newHp <= 0) resetUpd[`players/${id}/status`] = 'downed';
        });
      }
      ROOT.update(resetUpd);
    }
  });
}


async function buyItem(itemId) {
  const me = (fbState.players||{})[myId];
  if (!me || me.choiceSubmitted) return;

  let choiceText, choiceDisplay, goldCost = 0, newItem = null;

  if (itemId === 'pass') {
    choiceText = 'Passed on the shop';
    choiceDisplay = 'pass';
  } else {
    const item = SHOP_ITEMS.find(i => i.id === itemId);
    if (!item) return;
    if (me.gold < item.cost) return;
    goldCost = item.cost;
    newItem  = item.inv;
    choiceText    = `Bought ${item.name} from Mags (${item.cost}g)`;
    choiceDisplay = itemId;
  }

  const newGold = me.gold - goldCost;
  const newInv  = newItem ? [...(me.inventory||[]), newItem] : [...(me.inventory||[])];

  const upd = {
    [`players/${myId}/choice`]:          choiceText,
    [`players/${myId}/choiceId`]:        choiceDisplay,
    [`players/${myId}/choiceSubmitted`]: true,
    [`players/${myId}/gold`]:            newGold,
    [`players/${myId}/inventory`]:       newInv,
  };

  await ROOT.update(upd);
  playChoiceSound();
  triggerGoldBounce();
  checkAllSubmitted();
}

function submitByIdx(i) {
  const c = currentChoices[i];
  if (!c) return;

  const upd = {
    [`players/${myId}/choice`]: c.text,
    [`players/${myId}/choiceId`]: c.id,
    [`players/${myId}/choiceSubmitted`]: true,
  };
  if (c.usesAbility) upd[`players/${myId}/signatureUsed`] = true;
  if (c.usesItem) {
    const inv = [...((fbState.players||{})[myId]?.inventory || [])];
    const idx = inv.findIndex(it => it === c.usesItem || it.startsWith(c.usesItem));
    if (idx > -1) inv.splice(idx, 1);
    upd[`players/${myId}/inventory`] = inv;
  }

  ROOT.update(upd).then(() => {
    playChoiceSound();
    checkAllSubmitted();
  });
}

function checkAllSubmitted() {
  ROOT.once('value', snap => {
    const s = snap.val() || {};
    if (s.session?.phase !== 'choosing') return;
    const ps = s.players || {};
    const allDone = Object.values(ps).every(p => p.status==='downed' || p.choiceSubmitted);
    if (allDone) {
      playAllReadySound();
      triggerReadyFlash();
      ROOT.update({ 'session/phase':'waiting_for_narration' });
    }
  });
}

// ═══════════════════════════════════════════════════════
//  SCENE NARRATION API CALL (all scenes after 1)
// ═══════════════════════════════════════════════════════
async function fireSceneNarration(state) {
  if (!isGM) return;
  state = state || fbState;
  const scene  = state.session?.currentScene || 2;
  const lock   = ROOT.child(`narrationLock/scene${scene}`);
  let acquired = false;
  await lock.transaction(cur => { if (!cur) { acquired=true; return true; } });
  if (!acquired) return;

  await ROOT.update({ 'session/phase':'narrating', 'narration/generating':true });

  const players = state.players || {};
  const scData  = SCENES[scene];

  const choiceMap = {};
  Object.entries(players).forEach(([id,p]) => { if (p.choiceId) choiceMap[id] = p.choiceId; });

  const track = scData?.type === 'riddle'
    ? (state.riddleSolved ? 'good' : 'bad')
    : scData?.outcomeTrack ? scData.outcomeTrack(choiceMap) : 'neutral';

  // ── Calculate damage/healing BEFORE calling Claude ──
  // Use players from state (not fresh snap) so we can describe current HP accurately
  const deltas = scData?.applyOutcome ? scData.applyOutcome(players, track) : {};

  // Build outcome summary for Claude so narration matches reality exactly
  let outcomeSummary = '';
  if (Object.keys(deltas).length > 0) {
    const lines = Object.entries(deltas).map(([id, d]) => {
      const p = players[id];
      if (!p) return null;
      const current = p.hp || 0;
      const maxHp = p.maxHp || current;
      const newHp = Math.min(maxHp, Math.max(0, current + d));
      if (d < 0) return `${p.name} takes ${Math.abs(d)} damage (HP: ${current} → ${newHp}${newHp <= 0 ? ' — DOWNED' : ''})`;
      if (d > 0) return `${p.name} heals ${d} HP (HP: ${current} → ${newHp})`;
      return null;
    }).filter(Boolean);
    if (lines.length) outcomeSummary = `\n\nACTUAL DAMAGE/HEALING (narrate these exactly — do not invent different targets):\n${lines.join('\n')}`;
  }

  // Gold loot
  let goldSummary = '';
  if (track === 'good' && scData?.goodLootGold) {
    const g = scData.goodLootGold();
    goldSummary = `\n\nGOLD FOUND: Each active player finds ${g}g.`;
    // Store gold amount for application after narration
    deltas.__goldLoot = g;
  }

  const party = Object.values(players).map(p =>
    `${p.name} (${p.title||p.archetype}, HP: ${p.hp}/${p.maxHp}, Gold: ${p.gold}g)
  Inventory: ${(p.inventory||[]).join(', ')}
  Choice: "${p.choice || 'did nothing'}"${p.status==='downed' ? ' [CURRENTLY DOWNED]' : ''}`
  ).join('\n\n');

  const hint = { good:'Things go relatively well.', neutral:'Mixed result — some consequence, not catastrophic.', bad:'Poor choices. Things go badly.' };
  const shopNote = scData?.type === 'shop'
    ? '\n\nThis is the merchant checkpoint scene. Each player either bought one item or passed. Reference what each person bought (or did not) and how they interacted with Mags. The rest alcove gives everyone a small HP recovery — work that in naturally. Gerald is in the corner if he survived.'
    : '';
  const riddleNote = scData?.type === 'riddle'
    ? `\n\nThis is the Syndicate Puzzle Lock scene. Each player was shown one personal line of a riddle and had to communicate out loud to solve it. The answer is that each line describes something personal to that family member — and each player submits their own first name. ${fbState.riddleSolved ? 'They solved it correctly. The door opened. Narrate the triumph — make it feel earned.' : 'They failed to solve it correctly (used all attempts). The door discharged 8 damage to everyone and then opened anyway because the Syndicate has a liability clause. Narrate the failure with appropriate System commentary.'}`
    : '';

  const prompt = `SCENE ${scene}: ${scData?.name || ''}
${scData?.desc || ''}

PLAYER CHOICES:
${party}

OUTCOME TRACK: ${track.toUpperCase()} — ${hint[track]||''}${outcomeSummary}${goldSummary}${shopNote}${riddleNote}

YOUR RESPONSE MUST HAVE EXACTLY TWO SECTIONS SEPARATED BY ---SYSTEM---

SECTION 1 — THE NARRATIVE (2 paragraphs):
Tell the story of what happened. Reference every player by name. Make their choices feel real. No mechanical announcements here — just the scene unfolding. Do not mention damage numbers or gold amounts in this section.

---SYSTEM---

SECTION 2 — THE SYSTEM VERDICT (3-6 lines, terminal voice):
THE SYSTEM delivers its verdict. Use this format:
- One line per player who took damage: "DAMAGE: [Name] — [amount] damage. HP: [new]/[max]."
- One line if gold was found: "GOLD: Each survivor finds [amount]g."
- One line if anyone is downed: "[Name] is down. THE SYSTEM notes this."
- One optional achievement if truly earned: "NEW ACHIEVEMENT! [Title] — [one line]."
- One final status line: dry, blunt, THE SYSTEM voice.
If nothing bad happened, keep it short. THE SYSTEM does not pad.`;

  try {
    const raw = await callClaude(prompt);

    // Split on separator
    const sepIdx = raw.indexOf('---SYSTEM---');
    const narrative = sepIdx > -1 ? raw.substring(0, sepIdx).trim() : raw.trim();
    const verdict   = sepIdx > -1 ? raw.substring(sepIdx + 12).trim() : '';

    // Read fresh HP from Firebase to apply deltas against current values
    const freshSnap = await ROOT.child('players').once('value');
    const freshPlayers = freshSnap.val() || players;

    const hpUpd = {};
    const goldLoot = deltas.__goldLoot || 0;
    Object.entries(deltas).forEach(([id, d]) => {
      if (id === '__goldLoot') return;
      const current = freshPlayers[id]?.hp ?? 0;
      const maxHp   = freshPlayers[id]?.maxHp || current;
      const newHp   = Math.min(maxHp, Math.max(0, current + d));
      hpUpd[`players/${id}/hp`] = newHp;
      if (newHp <= 0) hpUpd[`players/${id}/status`] = 'downed';
    });

    if (goldLoot > 0) {
      Object.keys(freshPlayers).forEach(id => {
        hpUpd[`players/${id}/gold`] = (freshPlayers[id].gold||0) + goldLoot;
      });
    }

    await ROOT.update({
      'narration/text':      narrative,
      'narration/verdict':   verdict,
      'narration/scene':     scene,
      'narration/track':     track,
      'narration/timestamp': Date.now(),
      'narration/generating': false,
      'session/phase':       'scene_complete',
      ...hpUpd,
    });
  } catch(e) {
    await lock.remove();
    ROOT.update({
      'narration/text': `THE SYSTEM has experienced a critical malfunction.\n[${e.message}]\nUse GM panel to continue.`,
      'narration/generating': false,
      'session/phase': 'scene_complete',
    });
  }
}

// ═══════════════════════════════════════════════════════
//  SCENE TRANSITIONS
// ═══════════════════════════════════════════════════════
const txCanvas = document.createElement('canvas');
txCanvas.style.cssText = 'position:fixed;inset:0;z-index:400;pointer-events:none;';
document.body.appendChild(txCanvas);
const txCtx = txCanvas.getContext('2d');
function resizeTx() { txCanvas.width = window.innerWidth; txCanvas.height = window.innerHeight; }
resizeTx(); window.addEventListener('resize', resizeTx);

function showTransition(toScene, callback) {
  const W = txCanvas.width, H = txCanvas.height;
  const animDuration = 4800;   // animation phase — longer, more cinematic
  const holdDuration  = 800;   // hold black after animation
  const fadeDuration  = 900;   // fade out to reveal new scene
  const draws = { 2:txTrapCorridor, 3:txGerald,   4:txAmbush,   5:txDarkness,
                  6:txMags,         7:txBarracks,  8:txElites,   9:txBoss, 10:txVictory };
  const draw = draws[toScene] || txCorridorRush;
  let raf;
  let phase = 'anim'; // 'anim' → 'hold' → 'fadeout'
  let phaseStart = performance.now();
  let callbackFired = false;

  function frame(now) {
    const elapsed = now - phaseStart;

    if (phase === 'anim') {
      const t = Math.min(elapsed / animDuration, 1);
      // Fade in over first 8%, hold full, fade to black over last 12%
      const alpha = t < 0.08 ? t/0.08 : t > 0.88 ? 1 : 1;
      const toBlack = t > 0.92 ? (t - 0.92) / 0.08 : 0;
      txCtx.clearRect(0,0,W,H);
      txCtx.save(); txCtx.globalAlpha = alpha;
      draw(txCtx, t, W, H, now);
      txCtx.restore();
      // Overlay to black at end of animation
      if (toBlack > 0) {
        txCtx.fillStyle = `rgba(0,0,0,${toBlack})`;
        txCtx.fillRect(0,0,W,H);
      }
      if (t >= 1) { phase = 'hold'; phaseStart = now; }

    } else if (phase === 'hold') {
      // Solid black — fire callback here so Firebase loads new content during hold
      txCtx.fillStyle = '#000';
      txCtx.fillRect(0,0,W,H);
      if (!callbackFired) { callbackFired = true; if (callback) callback(); }
      if (elapsed >= holdDuration) { phase = 'fadeout'; phaseStart = now; }

    } else if (phase === 'fadeout') {
      // Fade black overlay out to reveal the new scene underneath
      const ft = Math.min(elapsed / fadeDuration, 1);
      const alpha = 1 - ft;
      txCtx.clearRect(0,0,W,H);
      if (alpha > 0) {
        txCtx.fillStyle = `rgba(0,0,0,${alpha})`;
        txCtx.fillRect(0,0,W,H);
      }
      if (ft >= 1) { txCtx.clearRect(0,0,W,H); return; } // done
    }

    raf = requestAnimationFrame(frame);
  }

  if (raf) cancelAnimationFrame(raf);
  phaseStart = performance.now();
  raf = requestAnimationFrame(frame);
}

// ── helpers ──
function txFillBg(ctx, W, H, col='#040302') { ctx.fillStyle=col; ctx.fillRect(0,0,W,H); }
function txTorch(ctx, x, y, r, t) {
  const flicker = 0.75 + Math.sin(t*0.013+x)*0.15 + Math.sin(t*0.021+y)*0.1;
  const g = ctx.createRadialGradient(x,y,0,x,y,r*flicker);
  g.addColorStop(0,`rgba(255,170,50,${0.9*flicker})`);
  g.addColorStop(0.35,`rgba(220,100,20,${0.5*flicker})`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r*flicker*1.4,0,Math.PI*2); ctx.fill();
}
function txPerspLines(ctx, cx, cy, W, H, col='rgba(60,40,20,0.3)', n=16) {
  ctx.strokeStyle=col; ctx.lineWidth=1;
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(a)*W, cy+Math.sin(a)*H);
    ctx.stroke();
  }
}
function txSilhouette(ctx, path, col='#080604') {
  ctx.fillStyle=col; ctx.beginPath();
  path(ctx); ctx.fill();
}
function txText(ctx, txt, x, y, col='rgba(200,150,50,0.8)', size=22, font='Cinzel,serif') {
  ctx.fillStyle=col; ctx.font=`${size}px ${font}`; ctx.textAlign='center';
  ctx.shadowBlur=12; ctx.shadowColor=col; ctx.fillText(txt,x,y); ctx.shadowBlur=0;
}

// ── GENERIC: Corridor Rush ──
function txCorridorRush(ctx, t, W, H, now) {
  txFillBg(ctx,W,H,'#040302');
  const cx=W/2, cy=H/2;
  const zoom = 0.3 + t*1.4;
  // Stone walls via perspective quad
  const hw=W*0.38/zoom, hh=H*0.42/zoom;
  ctx.fillStyle='#100c07';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(cx-hw,cy-hh); ctx.lineTo(cx-hw,cy+hh); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#0e0a06';
  ctx.beginPath(); ctx.moveTo(W,0); ctx.lineTo(cx+hw,cy-hh); ctx.lineTo(cx+hw,cy+hh); ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#080604';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(cx-hw,cy-hh); ctx.lineTo(cx+hw,cy-hh); ctx.lineTo(W,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#0c0905';
  ctx.beginPath(); ctx.moveTo(0,H); ctx.lineTo(cx-hw,cy+hh); ctx.lineTo(cx+hw,cy+hh); ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  // Center passage
  ctx.fillStyle='#1a1208';
  ctx.beginPath(); ctx.rect(cx-hw,cy-hh,hw*2,hh*2); ctx.fill();
  // Torches
  for(let i=0;i<3;i++){
    const d=((i+t*1.4)%3)/3;
    const s=Math.max(0.05,1-d*0.85);
    txTorch(ctx, cx-hw*(1-d)*0.85, cy-(hh*(1-d)*0.6), 55*s, now);
    txTorch(ctx, cx+hw*(1-d)*0.85, cy-(hh*(1-d)*0.6), 55*s, now);
  }
  // Motion lines
  ctx.strokeStyle='rgba(80,55,25,0.12)'; ctx.lineWidth=1.5;
  for(let i=0;i<24;i++){
    const a=(i/24)*Math.PI*2, len=30+t*180;
    ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*18,cy+Math.sin(a)*18);
    ctx.lineTo(cx+Math.cos(a)*(18+len),cy+Math.sin(a)*(18+len)); ctx.stroke();
  }
  // Vignette
  const vig=ctx.createRadialGradient(cx,cy,H*0.2,cx,cy,H*0.85);
  vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(0,0,0,0.85)');
  ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);
}

// ── SCENE 2: Pressure Plate ──
function txTrapCorridor(ctx, t, W, H, now) {
  txFillBg(ctx,W,H,'#060402');
  txCorridorRush(ctx, Math.min(t*0.5,0.4), W, H, now);
  // Floor plate in center
  const px=W/2, py=H*0.72, pw=W*0.18, ph=H*0.06;
  const press = t > 0.4 ? Math.min((t-0.4)/0.3, 1) : 0;
  ctx.fillStyle=`rgba(80,60,30,${0.6+press*0.3})`;
  ctx.fillRect(px-pw/2, py-ph/2+press*8, pw, ph);
  ctx.strokeStyle=`rgba(180,140,60,${0.4+press*0.5})`; ctx.lineWidth=2;
  ctx.strokeRect(px-pw/2, py-ph/2+press*8, pw, ph);
  if(press > 0) {
    // Cracks
    ctx.strokeStyle=`rgba(200,160,80,${press*0.8})`; ctx.lineWidth=1.5;
    const cracks=[[0,-1],[1,-0.5],[-1,-0.7],[0.5,1],[-0.8,0.6]];
    cracks.forEach(([dx,dy])=>{
      ctx.beginPath(); ctx.moveTo(px,py+press*8);
      ctx.lineTo(px+dx*pw*0.8+Math.random()*10,py+dy*ph*2+press*8); ctx.stroke();
    });
    // Glow
    const g=ctx.createRadialGradient(px,py,0,px,py,pw*1.2);
    g.addColorStop(0,`rgba(255,180,40,${press*0.4})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(px-pw,py-ph,pw*2,ph*3);
    // Dust
    for(let i=0;i<20;i++){
      const a=(i/20)*Math.PI*2, spd=press*(30+Math.sin(i)*20);
      const dx2=Math.cos(a)*spd*(t-0.4), dy2=Math.sin(a)*spd*(t-0.4)-press*15;
      ctx.beginPath(); ctx.arc(px+dx2,py+dy2,Math.max(0.1,1.5*(1-press*0.5)),0,Math.PI*2);
      ctx.fillStyle=`rgba(180,150,80,${press*0.6*(1-t)})`; ctx.fill();
    }
  }
  txText(ctx,'...',W/2,H*0.15);
}

// ── SCENE 3: Gerald ──
function txGerald(ctx, t, W, H, now) {
  txFillBg(ctx,W,H,'#030201');
  // Alcove walls
  ctx.fillStyle='#0e0a06';
  ctx.beginPath(); ctx.roundRect(W*0.1,H*0.05,W*0.8,H*0.88,16); ctx.fill();
  ctx.fillStyle='#060402';
  ctx.beginPath(); ctx.roundRect(W*0.15,H*0.1,W*0.7,H*0.78,10); ctx.fill();
  // Torch flicker
  txTorch(ctx,W/2,H*0.18,70,now);
  // Two barrels in corner
  const bx=W*0.65, by=H*0.62;
  ctx.fillStyle='#1e1408';
  ctx.beginPath(); ctx.ellipse(bx,by,28,38,0.15,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(bx+30,by+8,24,32,-0.1,0,Math.PI*2); ctx.fill();
  // Barrel rings
  ctx.strokeStyle='rgba(80,55,25,0.6)'; ctx.lineWidth=2;
  [-12,0,12].forEach(dy => {
    ctx.beginPath(); ctx.ellipse(bx,by+dy,28,8,0.15,0,Math.PI*2); ctx.stroke();
  });
  // Gerald — sitting figure between/beside barrels, knees up
  const gx=W*0.58, gy=H*0.7;
  const breathe = Math.sin(now*0.004)*2;
  ctx.fillStyle='#1c1510'; // clothes — business casual, ruined
  // Body slumped
  ctx.beginPath(); ctx.ellipse(gx,gy+breathe,20,28,-0.2,0,Math.PI*2); ctx.fill();
  // Knees drawn up
  ctx.beginPath(); ctx.ellipse(gx-8,gy-16+breathe,14,10,0.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(gx+10,gy-14+breathe,14,10,-0.3,0,Math.PI*2); ctx.fill();
  // Head, slightly bowed
  ctx.fillStyle='#c8986a'; // skin tone
  ctx.beginPath(); ctx.arc(gx-4,gy-38+breathe,16,0,Math.PI*2); ctx.fill();
  // Hair — thinning, disheveled
  ctx.fillStyle='#3a2a18';
  ctx.beginPath(); ctx.ellipse(gx-4,gy-46+breathe,14,8,0,0,Math.PI); ctx.fill();
  // Granola bar in hand — small rectangle
  const gbt = Math.min(t*3, 1);
  if(gbt > 0) {
    ctx.fillStyle=`rgba(180,140,60,${gbt*0.9})`;
    ctx.fillRect(gx+12, gy-22+breathe, 18, 10);
    ctx.strokeStyle=`rgba(120,90,30,${gbt*0.7})`; ctx.lineWidth=1;
    ctx.strokeRect(gx+12, gy-22+breathe, 18, 10);
  }
  // Partial map on his lap — paper
  const mt = Math.min((t-0.2)*3, 1);
  if(mt > 0) {
    ctx.fillStyle=`rgba(200,180,120,${mt*0.7})`;
    ctx.beginPath(); ctx.roundRect(gx-18,gy-10+breathe,28,20,2); ctx.fill();
    // Map lines
    ctx.strokeStyle=`rgba(80,60,30,${mt*0.5})`; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(gx-14,gy-4+breathe); ctx.lineTo(gx+6,gy-4+breathe); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(gx-14,gy+2+breathe); ctx.lineTo(gx,gy+2+breathe); ctx.stroke();
  }
  // Text fade in
  const opacity = t > 0.38 ? Math.min((t-0.38)/0.22,1) : 0;
  txText(ctx,'His name is Gerald.',W/2,H*0.9,`rgba(200,160,80,${opacity})`,18);
  // Vignette
  const vig=ctx.createRadialGradient(W/2,H/2,H*0.15,W/2,H/2,H*0.72);
  vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(0,0,0,0.92)');
  ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);
}

// ── SCENE 4: Goblin Ambush ──
function txAmbush(ctx, t, W, H, now) {
  txFillBg(ctx,W,H,'#0a0302');
  // Background red tint
  ctx.fillStyle=`rgba(100,10,5,${Math.min(t*2,0.3)})`;
  ctx.fillRect(0,0,W,H);
  // Dropping goblin silhouettes
  const goblins=[{x:0.25,delay:0},{x:0.5,delay:0.18},{x:0.75,delay:0.09}];
  goblins.forEach(({x,delay})=>{
    const gt = Math.max(0, Math.min((t-delay)/0.72, 1));
    const gy = H*(-0.12) + gt*H*0.75;
    const gx = W*x;
    // Rope/trail
    if(gt < 0.9) {
      ctx.strokeStyle=`rgba(80,55,25,${0.5*(1-gt)})`; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,gy-30); ctx.stroke();
    }
    // Body
    ctx.fillStyle='#1a0e06';
    ctx.beginPath(); ctx.ellipse(gx,gy,16,22,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(gx,gy-28,12,0,Math.PI*2); ctx.fill();
    // Weapon glint
    if(gt > 0.5) {
      ctx.strokeStyle=`rgba(200,180,100,${(gt-0.5)*1.5})`; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(gx+12,gy-10); ctx.lineTo(gx+28,gy-35); ctx.stroke();
    }
  });
  // Big slash effect
  const slashT = Math.max(0,Math.min((t-0.45)/0.25,1));
  if(slashT > 0) {
    ctx.save(); ctx.globalAlpha=slashT*(1-Math.max(0,(t-0.6)/0.25));
    ctx.strokeStyle='rgba(220,40,20,0.9)'; ctx.lineWidth=6;
    ctx.shadowBlur=20; ctx.shadowColor='rgba(255,50,20,0.8)';
    ctx.beginPath(); ctx.moveTo(W*0.1,H*0.25); ctx.lineTo(W*0.9,H*0.7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W*0.15,H*0.6); ctx.lineTo(W*0.85,H*0.2); ctx.stroke();
    ctx.restore();
  }
  // Impact flash
  if(t > 0.3 && t < 0.5) {
    ctx.fillStyle=`rgba(255,80,20,${(0.5-t)*0.5})`;
    ctx.fillRect(0,0,W,H);
  }
  const opacity = t > 0.42 ? Math.min((t-0.42)/0.22,1) : 0;
  txText(ctx,'AMBUSH.',W/2,H*0.88,`rgba(220,80,40,${opacity})`,28);
  const vig=ctx.createRadialGradient(W/2,H/2,H*0.1,W/2,H/2,H*0.8);
  vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(0,0,0,0.88)');
  ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);
}

// ── SCENE 5: Darkness / Kobold Ambush ──
function txDarkness(ctx, t, W, H, now) {
  // Start lit, then lights go out
  const lightOut = t > 0.25 ? Math.min((t-0.25)/0.18, 1) : 0;
  const darkness = lightOut;

  // Room when lit
  if (lightOut < 1) {
    const lit = 1 - lightOut;
    txFillBg(ctx, W, H, `rgb(${Math.floor(14*lit)},${Math.floor(10*lit)},${Math.floor(6*lit)})`);
    // Torches on walls
    [W*0.15, W*0.85].forEach(tx2 => {
      txTorch(ctx, tx2, H*0.3, 60*(1-lightOut*0.8), now);
    });
    // Wall lines
    ctx.strokeStyle=`rgba(50,35,18,${lit*0.4})`; ctx.lineWidth=1;
    for(let i=0;i<6;i++){
      ctx.beginPath(); ctx.moveTo(0,H*0.15*i); ctx.lineTo(W,H*0.15*i); ctx.stroke();
    }
  }

  // Darkness taking over
  if (lightOut > 0) {
    ctx.fillStyle=`rgba(0,0,0,${lightOut*0.98})`;
    ctx.fillRect(0,0,W,H);
  }

  // Glowing reptilian eyes appearing in the dark
  if (t > 0.5) {
    const eyeT = (t - 0.5) / 0.5;
    const eyePairs = [
      {x:W*0.2, y:H*0.45}, {x:W*0.75, y:H*0.38},
      {x:W*0.5, y:H*0.55}, {x:W*0.35, y:H*0.32},
      {x:W*0.65, y:H*0.6},
    ];
    eyePairs.forEach(({x,y}, i) => {
      const delay = i * 0.12;
      const et = Math.max(0, Math.min((eyeT - delay) / 0.2, 1));
      if (et <= 0) return;
      // Blink
      const blink = Math.sin(now*0.007 + i*1.4) > 0.85 ? 0 : 1;
      const alpha = et * blink * 0.9;
      // Glow
      const gl = ctx.createRadialGradient(x,y,0,x,y,30);
      gl.addColorStop(0,`rgba(120,220,60,${alpha*0.3})`);
      gl.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=gl; ctx.fillRect(x-35,y-35,70,70);
      // Eyes
      ctx.fillStyle=`rgba(120,220,60,${alpha})`;
      ctx.shadowBlur=8*et; ctx.shadowColor=`rgba(100,200,50,0.8)`;
      ctx.beginPath(); ctx.ellipse(x-7,y,5,3,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x+7,y,5,3,0,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
    });
  }

  // Syndicate notification text
  const msgT = t > 0.35 && t < 0.55 ? Math.min((t-0.35)/0.08, 1) * (1-Math.max(0,(t-0.45)/0.08)) : 0;
  if (msgT > 0) {
    txText(ctx,'[ TORCH TIMER: 0:00 — Feature added in patch 2.3 ]',W/2,H*0.12,
      `rgba(180,220,180,${msgT*0.8})`,14,'Share Tech Mono,monospace');
  }

  const opacity = t > 0.45 ? Math.min((t-0.45)/0.22,1) : 0;
  txText(ctx,'They can see in the dark.',W/2,H*0.88,`rgba(120,220,60,${opacity})`,20);
}

// ── SCENE 6: Mags the Merchant ──
function txMags(ctx, t, W, H, now) {
  txFillBg(ctx,W,H,'#060402');
  const warmT = Math.min(t*1.5,1);
  const g=ctx.createRadialGradient(W/2,H*0.55,0,W/2,H*0.55,H*0.6);
  g.addColorStop(0,`rgba(200,130,40,${warmT*0.25})`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // Cart rolling in from right
  const cartX = W*1.1 - t*W*0.52;
  ctx.fillStyle='#1a1008';
  ctx.beginPath(); ctx.roundRect(cartX-60,H*0.52,120,60,6); ctx.fill();
  ctx.strokeStyle='#2a1a08'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.arc(cartX-35,H*0.62,22,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cartX+35,H*0.62,22,0,Math.PI*2); ctx.stroke();
  for(let i=0;i<6;i++){
    const a=(i/6)*Math.PI*2 + now*0.004;
    ctx.beginPath(); ctx.moveTo(cartX-35,H*0.62); ctx.lineTo(cartX-35+Math.cos(a)*20,H*0.62+Math.sin(a)*20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cartX+35,H*0.62); ctx.lineTo(cartX+35+Math.cos(a)*20,H*0.62+Math.sin(a)*20); ctx.stroke();
  }
  // Spinning gold coin
  const coinT = Math.min(t*2,1);
  const coinX=W*0.42, coinY=H*0.3 - coinT*H*0.05;
  const coinW = 28*Math.abs(Math.cos(now*0.018));
  ctx.fillStyle=`rgba(220,170,40,${coinT*0.9})`;
  ctx.beginPath(); ctx.ellipse(coinX,coinY,Math.max(1,coinW),28,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=`rgba(255,210,80,${coinT*0.7})`; ctx.lineWidth=2; ctx.stroke();
  const opacity = t > 0.38 ? Math.min((t-0.38)/0.22,1) : 0;
  txText(ctx,'"Lovely to see adventurers still alive."',W/2,H*0.88,`rgba(200,160,70,${opacity})`,17);
  const vig=ctx.createRadialGradient(W/2,H*0.5,H*0.15,W/2,H*0.5,H*0.75);
  vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(0,0,0,0.9)');
  ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);
}

// ── SCENE 6 (old): Riddle Wall — kept for potential future use ──
function txRiddleWall(ctx, t, W, H, now) {
  txFillBg(ctx,W,H,'#040302');
  const cx=W/2, cy=H*0.48;
  // Stone door
  const dw=W*0.38, dh=H*0.62;
  ctx.fillStyle='#1c1610';
  ctx.beginPath(); ctx.roundRect(cx-dw/2,cy-dh/2,dw,dh,8); ctx.fill();
  // Door arch
  ctx.fillStyle='#140f0a';
  ctx.beginPath(); ctx.ellipse(cx,cy-dh/2,dw/2,dh*0.15,0,Math.PI,0); ctx.fill();
  // Stone texture lines
  ctx.strokeStyle='rgba(60,45,25,0.5)'; ctx.lineWidth=1;
  for(let row=0;row<8;row++){
    const ry=cy-dh/2+row*(dh/8);
    ctx.beginPath(); ctx.moveTo(cx-dw/2,ry); ctx.lineTo(cx+dw/2,ry); ctx.stroke();
    const offset=row%2===0?0:dw/4;
    ctx.beginPath(); ctx.moveTo(cx-dw/2+offset,ry); ctx.lineTo(cx-dw/2+offset,ry+dh/8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+offset-dw/4,ry); ctx.lineTo(cx+offset-dw/4,ry+dh/8); ctx.stroke();
  }
  // Four runes lighting up sequentially
  const runePositions=[{x:cx-dw*0.22,y:cy-dh*0.18},{x:cx+dw*0.22,y:cy-dh*0.18},
                       {x:cx-dw*0.22,y:cy+dh*0.1},{x:cx+dw*0.22,y:cy+dh*0.1}];
  const runeSymbols=['ᚱ','ᚢ','ᚾ','ᛖ'];
  const runeColors=['rgba(100,180,255,','rgba(180,100,255,','rgba(100,255,180,','rgba(255,180,100,'];
  runePositions.forEach(({x,y},i)=>{
    const rt = Math.max(0,Math.min((t-(i*0.18))/0.25,1));
    if(rt > 0){
      const gl=ctx.createRadialGradient(x,y,0,x,y,30);
      gl.addColorStop(0,`${runeColors[i]}${rt*0.5})`);
      gl.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=gl; ctx.fillRect(x-35,y-35,70,70);
      ctx.fillStyle=`${runeColors[i]}${rt*0.9})`;
      ctx.font=`bold ${28*rt}px serif`; ctx.textAlign='center';
      ctx.shadowBlur=12*rt; ctx.shadowColor=`${runeColors[i]}0.8)`;
      ctx.fillText(runeSymbols[i],x,y+10); ctx.shadowBlur=0;
    }
  });
  // All runes lit — door glow
  if(t > 0.75){
    const glow = (t-0.75)/0.25;
    const dg=ctx.createRadialGradient(cx,cy,0,cx,cy,dw*0.7);
    dg.addColorStop(0,`rgba(200,220,255,${glow*0.15})`);
    dg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=dg; ctx.fillRect(0,0,W,H);
  }
  const opacity = t > 0.40 ? Math.min((t-0.40)/0.22,1) : 0;
  txText(ctx,'ANSWER TOGETHER.',W/2,H*0.9,`rgba(180,200,255,${opacity})`,20);
  const vig=ctx.createRadialGradient(cx,cy,dh*0.2,cx,cy,H*0.85);
  vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(0,0,0,0.9)');
  ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);
}

// ── SCENE 7: Barracks ──
function txBarracks(ctx, t, W, H, now) {
  txFillBg(ctx,W,H,'#040302');
  const warmT = Math.min(t*1.8,1);
  // Room walls
  ctx.fillStyle='#0e0a06';
  ctx.fillRect(W*0.08,H*0.05,W*0.84,H*0.88);
  // Floor
  ctx.fillStyle='#080604';
  ctx.fillRect(W*0.08,H*0.7,W*0.84,H*0.25);
  // Bunk beds silhouettes - left
  ctx.fillStyle='#1a1208';
  ctx.fillRect(W*0.12,H*0.25,W*0.22,H*0.42); // frame
  ctx.fillStyle='#100e08';
  ctx.fillRect(W*0.12,H*0.32,W*0.22,H*0.06); // bottom bunk
  ctx.fillRect(W*0.12,H*0.5,W*0.22,H*0.06); // top bunk
  // Bunk beds - right
  ctx.fillStyle='#1a1208';
  ctx.fillRect(W*0.66,H*0.25,W*0.22,H*0.42);
  ctx.fillStyle='#100e08';
  ctx.fillRect(W*0.66,H*0.32,W*0.22,H*0.06);
  ctx.fillRect(W*0.66,H*0.5,W*0.22,H*0.06);
  // Firepit in center — slowly brightening
  const fireX=W*0.5, fireY=H*0.68;
  txTorch(ctx,fireX,fireY,70*warmT,now);
  // Small ember particles rising from fire
  for(let i=0;i<12;i++){
    const ep=((i/12)+t*0.6)%1;
    const ex=fireX+(Math.sin(i*2.4+now*0.005)*30);
    const ey=fireY-ep*H*0.3;
    if(ep < 0.9){
      ctx.beginPath(); ctx.arc(ex,ey,Math.max(0.1,1.5*(1-ep)),0,Math.PI*2);
      ctx.fillStyle=`rgba(255,${140+Math.sin(i)*40},30,${(1-ep)*0.7*warmT})`; ctx.fill();
    }
  }
  // Card game on crate
  ctx.fillStyle='rgba(40,30,15,0.8)';
  ctx.fillRect(W*0.42,H*0.6,W*0.16,H*0.07);
  ctx.fillStyle='rgba(180,150,80,0.4)';
  [[W*0.44,H*0.62,0.1],[W*0.48,H*0.61,-.12],[W*0.52,H*0.625,.08]].forEach(([x,y,r])=>{
    ctx.save(); ctx.translate(x,y); ctx.rotate(r);
    ctx.fillRect(-10,-14,20,28); ctx.restore();
  });
  const opacity = t > 0.35 ? Math.min((t-0.35)/0.22,1) : 0;
  txText(ctx,'A moment to breathe.',W/2,H*0.92,`rgba(200,160,80,${opacity})`,18);
  const vig=ctx.createRadialGradient(fireX,fireY,H*0.05,W/2,H/2,H*0.75);
  vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(0,0,0,0.88)');
  ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);
}

// ── SCENE 8: Elite Guard ──
function txElites(ctx, t, W, H, now) {
  txFillBg(ctx,W,H,'#060202');
  ctx.fillStyle=`rgba(80,10,5,${Math.min(t*0.8,0.2)})`;
  ctx.fillRect(0,0,W,H);
  txCorridorRush(ctx,0.25,W,H,now);
  // Two elite silhouettes stepping forward
  const advance = Math.min(t/0.7,1);
  const elites=[{x:W*0.3,flip:-1},{x:W*0.7,flip:1}];
  elites.forEach(({x,flip},ei)=>{
    const delay = ei*0.08;
    const et = Math.max(0,Math.min((t-delay)/0.65,1));
    const ey = H*0.15 + (1-et)*H*0.12;
    const scale = 0.7 + et*0.45;
    ctx.save(); ctx.translate(x,ey); ctx.scale(flip*scale,scale);
    ctx.fillStyle='#1e1408';
    // Body/armor
    ctx.beginPath(); ctx.ellipse(0,H*0.45,30,55,0,0,Math.PI*2); ctx.fill();
    // Shoulders (pauldrons)
    ctx.beginPath(); ctx.ellipse(-28,H*0.28,20,15,0.4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(28,H*0.28,20,15,-0.4,0,Math.PI*2); ctx.fill();
    // Head with helmet
    ctx.beginPath(); ctx.arc(0,H*0.2,24,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#0a0804';
    ctx.beginPath(); ctx.ellipse(0,H*0.18,18,10,0,0,Math.PI*2); ctx.fill(); // visor shadow
    // Shield (first elite only in ei===0)
    if(ei===0){
      ctx.fillStyle='#2a1c0a';
      ctx.beginPath(); ctx.roundRect(32,H*0.22,28,55,4); ctx.fill();
      // Shield glint
      const glint=(Math.sin(now*0.009)+1)/2;
      ctx.strokeStyle=`rgba(200,170,80,${glint*et*0.8})`; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(36,H*0.26); ctx.lineTo(36,H*0.54); ctx.stroke();
    }
    // Weapon glint
    const wglint = t > 0.5 ? Math.sin(now*0.012)*0.5+0.5 : 0;
    ctx.strokeStyle=`rgba(180,160,80,${wglint*et})`; ctx.lineWidth=3;
    ctx.shadowBlur=8*wglint; ctx.shadowColor='rgba(220,200,100,0.6)';
    ctx.beginPath(); ctx.moveTo(-25,H*0.3); ctx.lineTo(-50,H*0.1); ctx.stroke();
    ctx.shadowBlur=0;
    ctx.restore();
  });
  // Eye glow on elites
  if(t > 0.4){
    const eg=(t-0.4)/0.4;
    elites.forEach(({x})=>{
      ctx.fillStyle=`rgba(220,40,20,${eg*0.7})`;
      ctx.beginPath(); ctx.ellipse(x-8,H*0.34,4,3,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x+8,H*0.34,4,3,0,0,Math.PI*2); ctx.fill();
    });
  }
  const opacity = t > 0.42 ? Math.min((t-0.42)/0.22,1) : 0;
  txText(ctx,'They are not embarrassed.',W/2,H*0.9,`rgba(200,80,60,${opacity})`,20);
  const vig=ctx.createRadialGradient(W/2,H*0.45,H*0.1,W/2,H/2,H*0.75);
  vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(0,0,0,0.9)');
  ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);
}

// ── SCENE 9: Boss Entrance ──
function txBoss(ctx, t, W, H, now) {
  txFillBg(ctx,W,H,'#040101');
  const cx=W/2;
  // Throne room — wider corridor
  ctx.fillStyle='#100806';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(cx-W*0.4,H); ctx.lineTo(cx+W*0.4,H); ctx.lineTo(W,0); ctx.closePath(); ctx.fill();
  // Skull decorations on walls
  const skullPositions=[{x:W*0.12,y:H*0.3},{x:W*0.22,y:H*0.5},{x:W*0.88,y:H*0.3},{x:W*0.78,y:H*0.5}];
  skullPositions.forEach(({x,y})=>{
    ctx.fillStyle='rgba(60,45,25,0.7)';
    ctx.beginPath(); ctx.arc(x,y,12,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x,y+10,8,0,Math.PI); ctx.fill();
    ctx.fillStyle='rgba(20,15,8,0.9)';
    ctx.beginPath(); ctx.ellipse(x-4,y-2,3,4,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+4,y-2,3,4,0,0,Math.PI*2); ctx.fill();
  });
  // Torches on far walls
  txTorch(ctx,W*0.05,H*0.35,45,now);
  txTorch(ctx,W*0.95,H*0.35,45,now);
  // Throne base
  ctx.fillStyle='#1e1008';
  ctx.beginPath(); ctx.roundRect(cx-55,H*0.52,110,H*0.32,4); ctx.fill();
  // Throne back spikes
  for(let i=0;i<7;i++){
    const sx=cx-48+i*16;
    ctx.fillStyle='#2a1610';
    ctx.beginPath(); ctx.moveTo(sx,H*0.52); ctx.lineTo(sx+8,H*0.25+i%2*H*0.06); ctx.lineTo(sx+16,H*0.52); ctx.closePath(); ctx.fill();
  }
  // Krag rising — dramatic slow reveal
  const riseT = Math.min(t/0.92,1);
  const kragY = H*1.05 - riseT*H*0.62;
  ctx.save(); ctx.translate(cx, kragY);
  ctx.fillStyle='#1a0c06';
  // Massive body
  ctx.beginPath(); ctx.ellipse(0,0,55,85,0,0,Math.PI*2); ctx.fill();
  // Huge shoulders
  ctx.beginPath(); ctx.ellipse(-58,-30,32,22,0.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(58,-30,32,22,-0.5,0,Math.PI*2); ctx.fill();
  // Head
  ctx.beginPath(); ctx.arc(0,-95,35,0,Math.PI*2); ctx.fill();
  // Crown/helmet spikes
  for(let i=0;i<5;i++){
    const sx=-30+i*15;
    ctx.fillStyle='#2e1a0a';
    ctx.beginPath(); ctx.moveTo(sx,-120); ctx.lineTo(sx+8,-145-i%2*12); ctx.lineTo(sx+15,-120); ctx.closePath(); ctx.fill();
  }
  // Glowing eyes
  const eyeGlow=(riseT>0.5)?(riseT-0.5)/0.5*0.9:0;
  ctx.fillStyle=`rgba(255,40,10,${eyeGlow})`;
  ctx.shadowBlur=15*eyeGlow; ctx.shadowColor='rgba(255,20,0,0.8)';
  ctx.beginPath(); ctx.ellipse(-12,-98,7,5,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(12,-98,7,5,0,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
  // Weapon — greataxe
  ctx.fillStyle='rgba(50,35,15,0.85)';
  ctx.beginPath(); ctx.moveTo(55,-20); ctx.lineTo(100,-80); ctx.lineTo(115,-40); ctx.lineTo(90,10); ctx.closePath(); ctx.fill();
  ctx.strokeStyle=`rgba(160,130,60,${eyeGlow*0.8})`; ctx.lineWidth=2;
  ctx.stroke();
  ctx.restore();
  // Dramatic lightning flash
  if(t > 0.65 && t < 0.75){
    ctx.fillStyle=`rgba(255,200,150,${(0.75-t)*3})`;
    ctx.fillRect(0,0,W,H);
  }
  // Red atmospheric glow from eyes
  if(riseT > 0.5){
    const rg=ctx.createRadialGradient(cx,kragY-95,0,cx,kragY-95,200);
    rg.addColorStop(0,`rgba(200,20,10,${(riseT-0.5)*0.25})`);
    rg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
  }
  const opacity = t > 0.45 ? Math.min((t-0.45)/0.2,1) : 0;
  txText(ctx,'KRAG THE WARCHIEF.',W/2,H*0.9,`rgba(220,80,50,${opacity})`,24);
  const vig=ctx.createRadialGradient(cx,H*0.6,H*0.08,cx,H/2,H*0.8);
  vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(0,0,0,0.92)');
  ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);
}

// ── SCENE 10: Victory ──
function txVictory(ctx, t, W, H, now) {
  txFillBg(ctx,W,H,'#040302');
  // Golden light flooding down from above
  const beams=8;
  for(let i=0;i<beams;i++){
    const bx=W*(0.1+i*0.12);
    const bw=W*0.06;
    const bt=Math.max(0,Math.min((t-i*0.06)/0.65,1));
    const g=ctx.createLinearGradient(bx,0,bx,H);
    g.addColorStop(0,`rgba(255,210,80,${bt*0.35})`);
    g.addColorStop(0.6,`rgba(220,160,40,${bt*0.12})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.moveTo(bx-bw/2,0); ctx.lineTo(bx+bw/2,0);
    ctx.lineTo(bx+bw*2,H); ctx.lineTo(bx-bw*2,H); ctx.closePath(); ctx.fill();
  }
  // Rising gold particles
  for(let i=0;i<40;i++){
    const pt=((i/40)+t*0.45)%1;
    const px=W*(0.1+Math.sin(i*2.1)*0.4);
    const py=H*(1.1-pt*1.3);
    const ps=2+Math.sin(i)*1.5;
    ctx.beginPath(); ctx.arc(px,py,Math.max(0.1,ps*(1-pt*0.5)),0,Math.PI*2);
    ctx.fillStyle=`rgba(255,${180+Math.sin(i)*40},50,${pt*(1-pt)*4*0.7})`; ctx.fill();
  }
  // Crown in center
  const ct=Math.min(t*2,1);
  const crx=W/2, cry=H*0.38;
  ctx.save(); ctx.translate(crx,cry); ctx.scale(ct,ct);
  ctx.fillStyle=`rgba(220,170,40,${ct*0.9})`;
  // Crown base
  ctx.fillRect(-45,0,90,25);
  // Crown points
  [[0,-50],[-28,-35],[28,-35]].forEach(([px2,py2])=>{
    ctx.beginPath(); ctx.moveTo(px2-15,0); ctx.lineTo(px2,py2); ctx.lineTo(px2+15,0); ctx.closePath(); ctx.fill();
  });
  ctx.shadowBlur=20*ct; ctx.shadowColor='rgba(255,200,60,0.8)';
  ctx.fillStyle=`rgba(255,220,80,${ct})`;
  ctx.fillRect(-45,0,90,25);
  ctx.shadowBlur=0;
  // Jewels
  ['rgba(255,60,60,0.9)','rgba(60,140,255,0.9)','rgba(60,220,80,0.9)'].forEach((col,i)=>{
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.arc(-25+i*25,12,5,0,Math.PI*2); ctx.fill();
  });
  ctx.restore();
  // THE SYSTEM text
  const textT = t > 0.45 ? Math.min((t-0.45)/0.3,1) : 0;
  txText(ctx,'THE DUNGEON IS CLEARED.',W/2,H*0.7,`rgba(255,210,80,${textT})`,26);
  txText(ctx,'THE SYSTEM IS GRUDGINGLY IMPRESSED.',W/2,H*0.78,`rgba(200,160,60,${textT*0.85})`,16);
  // Full screen golden glow
  if(t > 0.6){
    const gt=(t-0.6)/0.4;
    ctx.fillStyle=`rgba(200,140,20,${gt*0.08})`;
    ctx.fillRect(0,0,W,H);
  }
}


function setReady() {
  ROOT.child(`readiness/${myId}`).set(true).then(() => checkAllReady('scene1_ready', advanceToScene2));
}

function advanceToScene2() {
  showTransition(2, () => {
    const ps = fbState.players || {};
    const upd = { readiness:null, 'session/currentScene':2, 'session/phase':'scene_intro', 'narration/text':null, 'narration/verdict':null, 'narration/scene':null };
    Object.keys(ps).forEach(id => {
      upd[`players/${id}/choice`] = null;
      upd[`players/${id}/choiceId`] = null;
      upd[`players/${id}/choiceSubmitted`] = false;
    });
    ROOT.update(upd);
  });
}

function setContinue() {
  // First continue: go to system_verdict screen
  ROOT.child(`readiness/${myId}`).set(true).then(() => checkAllReady('scene_complete', () => {
    playAllReadySound();
    triggerReadyFlash();
    ROOT.update({ 'session/phase': 'system_verdict', readiness: null });
  }));
}

function setVerdictContinue() {
  // Second continue: advance to next scene
  ROOT.child(`readiness/${myId}`).set(true).then(() => checkAllReady('system_verdict', () => {
    playAllReadySound();
    triggerReadyFlash();
    advanceToNextScene();
  }));
}

function advanceToNextScene() {
  const cur  = fbState.session?.currentScene || 2;
  const next = cur + 1;
  showTransition(next, () => {
    const ps   = fbState.players || {};
    const upd  = { readiness:null, 'narration/text':null, 'narration/verdict':null, 'narration/scene':null, riddleAttempts:null, riddleSolved:null };
    upd[`narrationLock/scene${next}`] = null;
    Object.keys(ps).forEach(id => {
      upd[`players/${id}/choice`] = null;
      upd[`players/${id}/choiceId`] = null;
      upd[`players/${id}/choiceSubmitted`] = false;
    });
    if (SCENES[next]) {
      upd['session/currentScene'] = next;
      upd['session/phase'] = SCENES[next].type === 'intro' ? 'scene_intro' : 'choosing';
      // Luna reunion — add her to Melissa's inventory at Scene 8
      if (next === 9) {
        const melissaId = Object.keys(ps).find(id => ps[id].archetype === 'Melissa');
        if (melissaId) {
          const inv = [...(ps[melissaId].inventory || [])];
          if (!inv.includes('Luna (companion)')) inv.push('Luna (companion)');
          upd[`players/${melissaId}/inventory`] = inv;
        }
      }
    } else {
      upd['session/phase'] = 'demo_end';
    }
    ROOT.update(upd);
  });
}

function checkAllReady(requiredPhase, callback) {
  ROOT.once('value', snap => {
    const s = snap.val() || {};
    if (s.session?.phase !== requiredPhase) return;
    const ps  = s.players || {};
    const rdy = s.readiness || {};
    if (Object.keys(ps).every(id => rdy[id])) callback();
  });
}

// ═══════════════════════════════════════════════════════
//  TAUNT SYSTEM
// ═══════════════════════════════════════════════════════
function manageTaunts(phase, players) {
  const el = document.getElementById('tauntEl');
  if (!el) return;

  if (phase !== 'choosing') {    clearInterval(tauntTimer); tauntTimer = null; el.textContent = ''; return;
  }

  const waiting = Object.values(players).filter(p => !p.choiceSubmitted && p.status !== 'downed');
  if (!waiting.length) { el.textContent = ''; return; }

  const show = () => {
    const t    = waiting[Math.floor(Math.random() * waiting.length)];
    const pool = TAUNTS[t.archetype] || TAUNTS.default;
    const msg  = pool[tauntIdx % pool.length].replace('{n}', t.name);
    tauntIdx++;
    el.style.opacity = '0';
    setTimeout(() => { el.textContent = msg; el.style.opacity = '1'; }, 350);
  };

  if (!tauntTimer) { show(); tauntTimer = setInterval(show, 30000); }
}

// ═══════════════════════════════════════════════════════
//  TYPEWRITER EFFECT
// ═══════════════════════════════════════════════════════
function triggerTypewriteIfNeeded(narr) {
  if (!narr.text || !narr.scene) return;
  const key = `s${narr.scene}`;
  if (key === lastNarrKey) return;
  lastNarrKey = key;

  const el = document.getElementById('narrText');
  if (!el) return;
  const full = el.textContent;
  el.textContent = '';
  triggerNarrGlow();
  clearTimeout(typeTimer);

  const CHAR_DELAY = 16; // ms per character — must match across all tabs
  const elapsed = narr.timestamp ? Date.now() - narr.timestamp : 0;
  const startChar = Math.min(Math.floor(elapsed / CHAR_DELAY), full.length);

  // If we're joining late, render everything up to startChar instantly
  if (startChar > 0) {
    el.appendChild(document.createTextNode(full.substring(0, startChar)));
  }

  // If already fully done, show complete text and check achievement
  if (startChar >= full.length) {
    checkForAchievement(full);
    return;
  }

  // Continue typewriter from current position
  const cursor = document.createElement('span');
  cursor.className = 'narr-cursor';
  el.appendChild(cursor);

  let i = startChar;
  const tick = () => {
    if (i < full.length) {
      el.insertBefore(document.createTextNode(full[i++]), cursor);
      typeTimer = setTimeout(tick, CHAR_DELAY);
    } else {
      cursor.remove();
      checkForAchievement(full);
    }
  };
  tick();
}

// ═══════════════════════════════════════════════════════
//  GM PANEL
// ═══════════════════════════════════════════════════════
function renderGMPanel() {
  let bar = document.getElementById('gmBar');
  if (!bar) { bar = document.createElement('div'); bar.id = 'gmBar'; bar.className = 'gm-bar'; document.body.appendChild(bar); }

  const phase  = fbState.session?.phase || '—';
  const scene  = fbState.session?.currentScene || '—';
  const pcnt   = Object.keys(fbState.players||{}).length;

  const keySet = !!sessionStorage.getItem('dcs_apikey');

  bar.innerHTML = `
    <span class="gm-lbl">⚙ GM</span>
    <button class="btn btn-danger btn-sm" onclick="gmReset()">Reset Session</button>
    <span class="gm-sep">|</span>
    <button class="btn btn-sm" onclick="gmForceNext()">Force Next Scene</button>
    <button class="btn btn-sm" onclick="gmForceNarration()">Force Narration</button>
    <span class="gm-sep">|</span>
    <select id="gmJump">
      <option value="">Jump to Scene...</option>
      ${Object.entries(SCENES).map(([n,s])=>`<option value="${n}" ${n==scene?'selected':''}>Scene ${n}: ${s.name}</option>`).join('')}
      ${[4,5,6,7,8,9,10,11].filter(n=>!SCENES[n]).map(n=>`<option value="${n}">Scene ${n} (stub)</option>`).join('')}
    </select>
    <button class="btn btn-sm" onclick="gmJump()">Go</button>
    <span class="gm-sep">|</span>
    ${keySet
      ? `<span style="font-size:0.7rem;color:var(--green-b)">🔑 Key set</span>
         <button class="btn btn-sm" onclick="gmClearKey()">Clear Key</button>`
      : `<input id="gmKeyIn" type="password" placeholder="Paste Anthropic API key..." style="font-family:var(--f-mono);font-size:0.7rem;padding:5px 8px;background:var(--bg-card);border:1px solid var(--red);color:var(--parch);border-radius:2px;width:220px;">
         <button class="btn btn-sm btn-primary" onclick="gmSaveKey()">Set Key</button>`
    }
    <span class="gm-stat">Phase: ${phase} | Scene: ${scene} | Players: ${pcnt}/4</span>`;
}

function gmReset() {
  if (!confirm('Reset entire session? All players return to archetype selection.')) return;
  const resetToken = 'r_' + Math.random().toString(36).substr(2,9);
  ROOT.remove().then(() => {
    ROOT.set({ session: { active:false, phase:'archetype_selection', resetToken } });
  });
}

function gmForceNext() {
  const cur  = fbState.session?.currentScene || 1;
  const next = cur + 1;
  const ps   = fbState.players || {};
  const upd  = { 'session/currentScene':next, 'session/phase':'choosing', readiness:null, 'narration/text':null, 'narration/scene':null };
  upd[`narrationLock/scene${next}`] = null;
  Object.keys(ps).forEach(id => {
    upd[`players/${id}/choice`] = null;
    upd[`players/${id}/choiceId`] = null;
    upd[`players/${id}/choiceSubmitted`] = false;
  });
  ROOT.update(upd);
}

function gmForceNarration() {
  const ps  = fbState.players || {};
  const upd = { 'session/phase':'waiting_for_narration' };
  Object.keys(ps).forEach(id => {
    if (!ps[id].choiceSubmitted && ps[id].status !== 'downed') {
      upd[`players/${id}/choice`]          = 'Stood there looking confused';
      upd[`players/${id}/choiceId`]        = 'confused';
      upd[`players/${id}/choiceSubmitted`] = true;
    }
  });
  ROOT.update(upd);
}

function gmSaveKey() {
  const v = document.getElementById('gmKeyIn')?.value.trim();
  if (!v) return;
  sessionStorage.setItem('dcs_apikey', v);
  renderGMPanel();
}

function gmClearKey() {
  sessionStorage.removeItem('dcs_apikey');
  renderGMPanel();
}


function gmJump() {
  const n = parseInt(document.getElementById('gmJump')?.value);
  if (!n) return;
  const ps  = fbState.players || {};
  const upd = { 'session/currentScene':n, 'session/phase':'choosing', readiness:null, 'narration/text':null, 'narration/scene':null };
  upd[`narrationLock/scene${n}`] = null;
  Object.keys(ps).forEach(id => {
    upd[`players/${id}/choice`] = null;
    upd[`players/${id}/choiceId`] = null;
    upd[`players/${id}/choiceSubmitted`] = false;
  });
  ROOT.update(upd);
}

// ═══════════════════════════════════════════════════════
//  ANTHROPIC API
// ═══════════════════════════════════════════════════════
async function callClaude(userPrompt) {
  const key = sessionStorage.getItem('dcs_apikey');
  if (!key) throw new Error('No API key set. Open the GM panel (?gm=true) and enter your Anthropic API key.');
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 800,
      system: SYS_PROMPT,
      messages: [{ role:'user', content:userPrompt }],
    }),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
  const data = await res.json();
  return data.content?.[0]?.text || '[The System is silent. This is worse.]';
}

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
