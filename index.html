    : '';

  const kragPrepNote = scene === 11 && state.session?.kragPrep
    ? `\n\nKRAG PREPARATION (from previous scene): The party's approach to the throne room door was scored as "${state.session.kragPrep.toUpperCase()}". ${
        state.session.kragPrep === 'good'
          ? 'They were coordinated, prepared, and entered on their terms. They have the initiative. The first round should feel like they have the upper hand.'
          : state.session.kragPrep === 'bad'
          ? 'They rushed in or failed to coordinate. Krag heard them coming. He was ready before the door opened. Factor this into the first round — Krag has an edge.'
          : 'Mixed preparation. Some coordination, some chaos. Krag was not caught off guard, but neither was the party completely unprepared.'
      }`
    : '';

  const track = scData?.type === 'riddle'
    ? (() => {
        const correct = state.riddleCorrectCount ?? (state.riddleSolved ? (state.riddleTotalActive || 4) : 0);
        const total   = state.riddleTotalActive || Object.values(state.players || {}).filter(p => p.status !== 'downed').length || 4;
        if (correct === total)                        return 'good';
        if (correct >= Math.ceil(total / 2))          return 'neutral';
        return 'bad';
      })()
    : scData?.outcomeTrack ? scData.outcomeTrack(choiceMap) : 'neutral';

  // ── Freeform detection — if any active player typed their own choice ──
  const hasFreeform = Object.values(players).some(p => p.freeformChoice && p.status !== 'downed');

  // Build available-options context for Claude when freeform is in play
  let freeformContext = '';
  if (hasFreeform) {
    const me2 = Object.values(players).find(p => p.freeformChoice);
    const arch = me2?.archetype;
    if (arch && scData?.getChoices) {
      const availableOpts = scData.getChoices(arch, me2?.inventory || [], me2?.signatureUsed || false);
      const optList = availableOpts.map(o => `  • ${o.text}`).join('\n');
      freeformContext = `\n\nFREEFORM CHOICES IN PLAY:
One or more players chose to write their own action instead of selecting a listed option.
Listed options they could have chosen:\n${optList}

When a player writes their own action, judge it against these criteria:
1. Does it fit who this character is — their archetype, personality, and established abilities?
2. Does it help, hurt, or ignore what the party needs right now given the scene?
3. Does it show engagement with the actual situation, or is it evasion/joke/nothing?

A creative choice that fits the character should lean good. A safe but uninspired choice is neutral. Evasion, passivity, or deliberately unhelpful input is bad.

ABSURD INPUTS: If a player types something genuinely ridiculous (e.g. "I kick Krag in the groin," "I try to seduce the troll," "I do a backflip"), do NOT sanitize it or narrate around it. Call it what it is. Give it a bad or neutral track depending on whether it accidentally works. THE SYSTEM acknowledges these moments directly. They are the best moments. Treat them as such.

TONE MATCHING — match your narrative intensity to the intent of the typed choice:
- BRAVE / HEROIC (e.g. "I step in front of Melissa to take the hit", "I charge the goblin leader alone"): Narrate with genuine intensity. Let it land. The dungeon takes this seriously. THE SYSTEM is watching. Earn the moment before any humor touches it.
- CLEVER / STRATEGIC (e.g. "I use the echo of the room to triangulate their position"): Lean into the ingenuity. THE SYSTEM is briefly impressed — which it will not say directly but which will be detectable in the narration.
- CHAOTIC NEUTRAL (e.g. "I flip the table", "I throw Gerald at the goblin"): Let the chaos land with comic timing. Acknowledge the audacity. THE SYSTEM notes this approach is unorthodox. THE SYSTEM does not endorse it.
- STUPID / ACTIVELY COUNTERPRODUCTIVE (e.g. "I apologize to the goblin", "I sit down and eat my rations"): Ramp up the humor. THE SYSTEM is not angry. THE SYSTEM is tired. There is a difference. Make the failure specific and embarrassing.
- ABSURD / PHYSICALLY IMPROBABLE (e.g. "I seduce the troll", "I deliver a TED talk to the goblins"): Maximum comic energy. THE SYSTEM logs this as unprecedented. THE SYSTEM will remember it. So will the dungeon.
- SELFLESS / SACRIFICIAL (e.g. "I take the damage so Noah doesn't have to"): This is the one that gets played straight. No jokes on this one. THE SYSTEM notes it quietly. One line. The dungeon respects it.

REQUIRED: You must include TRACK: good, TRACK: neutral, or TRACK: bad as the FIRST LINE of your ---SYSTEM--- section. The damage calculations depend on this. Commit to one — do not hedge.`;
    }
  }

  // ── Combat round calculation ──
  let combatContinues = false;
  let newEnemyHp = null;
  let combatRound = state.combat?.round || 1;
  let enteringPhase2 = false;

  if (scData?.combatData) {
    const currentEnemyHp = state.combat?.enemyHp ?? scData.combatData.maxHp;
    const partyDmg = scData.combatData.partyDamage(choiceMap, track, players, state);

    // Troll regeneration — if fire/acid not used this round
    let regen = 0;
    if (scData.combatData.trollRegen) {
      const vals = Object.values(choiceMap);
      const usedFire = vals.some(v => v === 'fire' || v === 'use_torch');
      if (!usedFire) regen = scData.combatData.trollRegen;
    }

    newEnemyHp = Math.max(0, currentEnemyHp - partyDmg + regen);

    // Phase 2 check
    if (scData.combatData.phase2Threshold &&
        currentEnemyHp > scData.combatData.phase2Threshold &&
        newEnemyHp <= scData.combatData.phase2Threshold) {
      enteringPhase2 = true;
    }

    // Combat continues if enemies still alive and party not all downed
    const activePlayers = Object.values(players).filter(p => p.status === 'active');
    combatContinues = newEnemyHp > 0 && activePlayers.length > 0;
  }

  // ── Calculate damage/healing BEFORE calling Claude ──
  // Use players from state (not fresh snap) so we can describe current HP accurately
  const deltas = scData?.applyOutcome ? scData.applyOutcome(players, track) : {};

  // ── Apply item effects to deltas ──
  Object.entries(players).forEach(([id, p]) => {
    if (!p.choiceId || !p.choiceId.startsWith('use_')) return;
    const itemDef = USABLE_ITEMS.find(item => `use_${item.match.toLowerCase().replace(/\s+/g,'')}` === p.choiceId ||
                                              item.id === p.choiceId);
    if (!itemDef) return;
    const itemDeltas = applyItemEffect(itemDef, id, players);
    Object.entries(itemDeltas).forEach(([tid, d]) => {
      deltas[tid] = (deltas[tid] || 0) + d;
    });
  });

  // Build outcome summary for Claude so narration matches reality exactly
  let outcomeSummary = '';
  {
    const lines = Object.entries(players).map(([id, p]) => {
      if (p.status === 'downed') return null;
      if (id === '__goldLoot') return null;
      const d       = deltas[id];
      const current = p.hp || 0;
      const maxHp   = p.maxHp || current;
      if (d === undefined || d === 0) {
        return `${p.name} — no damage this round. HP stays at ${current}/${maxHp}. DO NOT add damage for this player.`;
      }
      const newHp = Math.min(maxHp, Math.max(0, current + d));
      if (d < 0) return `${p.name} takes ${Math.abs(d)} damage (HP: ${current} → ${newHp}${newHp <= 0 ? ' — DOWNED' : ''})`;
      if (d > 0) return `${p.name} heals ${d} HP (HP: ${current} → ${newHp})`;
      return null;
    }).filter(Boolean);
    if (lines.length) outcomeSummary = `\n\nACTUAL DAMAGE/HEALING — COMPLETE AND EXACT. Every active player is listed below. Use these verbatim in the verdict. Do NOT invent damage for any player. Do NOT omit any player:\n${lines.join('\n')}`;
  }

  // Gold loot — calculated before Claude call so amounts match
  let goldSummary = '';
  if (scData?.goodLootGold) {
    if (track === 'good') {
      const g = scData.goodLootGold();
      goldSummary = `\n\nGOLD FOUND: Each active player finds ${g}g. Include this in THE SYSTEM verdict as: "GOLD: Each survivor finds ${g}g."`;
      deltas.__goldLoot = g;
    } else if (track === 'neutral') {
      const g = Math.floor(scData.goodLootGold() * 0.5);
      if (g > 0) {
        goldSummary = `\n\nGOLD FOUND: Each active player finds ${g}g (partial loot). Include this in THE SYSTEM verdict as: "GOLD: Each survivor finds ${g}g."`;
        deltas.__goldLoot = g;
      }
    }
    // bad track: no gold
  }

  const party = Object.values(players).map(p =>
    `${p.name} (${p.title||p.archetype}, HP: ${p.hp}/${p.maxHp}, Gold: ${p.gold}g)
  Inventory: ${(p.inventory||[]).join(', ')}
  Choice: "${p.choice || 'did nothing'}"${p.status==='downed' ? ' [CURRENTLY DOWNED]' : ''}`
  ).join('\n\n');

  // Item usage summary for Claude
  const itemUsages = Object.values(players)
    .filter(p => p.choiceId?.startsWith('use_'))
    .map(p => {
      const item = USABLE_ITEMS.find(it => it.id === p.choiceId);
      if (!item) return null;
      const effectDesc = {
        heal_self: `heals ${item.amount} HP`,
        heal_party: `heals the whole party for ${item.amount} HP each`,
        boost_atk: `gains +${item.amount} ATK this scene`,
        smoke: 'creates a smoke cloud — stuns or escapes',
        spell: 'unleashes a powerful musical spell',
        reveal: `studies the enemy — party gains +${item.amount} ATK this scene`,
        rope: 'uses the rope for a tactical advantage',
        mystery: 'opens the Mystery Sack — effect unknown',
      }[item.effect] || '';
      return `${p.name} used ${item.match} — ${effectDesc}`;
    }).filter(Boolean);

  // Revive-other items — special narration note
  Object.values(players).forEach(p => {
    if (p.choiceId?.startsWith('revive_')) {
      const targetId  = p.choiceId.replace('revive_', '');
      const target    = players[targetId];
      const itemMatch = p.choice?.includes('Bandage') ? 'Bandage' : 'Health Potion';
      const reviveHp  = itemMatch === 'Bandage' ? 12 : 25;
      if (target) itemUsages.push(`${p.name} used ${itemMatch} on ${target.name} — revives them at ${reviveHp} HP`);
    }
  });

  // ── Bonus actions — process healing/buff alongside main choices ──
  Object.entries(players).forEach(([id, p]) => {
    if (!p.bonusAction || p.status === 'downed') return;
    const item = USABLE_ITEMS.find(it => it.id === p.bonusAction);
    if (!item) return;
    // Apply healing deltas
    if (item.effect === 'heal_self') {
      const maxHp = p.maxHp || p.hp;
      deltas[id] = (deltas[id] || 0) + Math.min(item.amount, maxHp - p.hp);
      itemUsages.push(`${p.name} also used ${item.match} as a bonus action — +${item.amount} HP (applied this scene)`);
    } else if (item.effect === 'heal_party') {
      Object.entries(players).forEach(([pid, pp]) => {
        if (pp.status === 'downed') return;
        deltas[pid] = (deltas[pid] || 0) + Math.min(item.amount, (pp.maxHp||pp.hp) - pp.hp);
      });
      itemUsages.push(`${p.name} shared ${item.match} as a bonus action — whole party healed ${item.amount} HP`);
    } else if (item.effect === 'boost_atk') {
      itemUsages.push(`${p.name} used ${item.match} as a bonus action — ATK boost this scene`);
    }
  });

  const itemSummary = itemUsages.length
    ? `\n\nITEMS USED THIS SCENE:\n${itemUsages.join('\n')}\nNarrate these item uses naturally. They happen alongside their other actions.`
    : '';

  // Carrying burden — downed players are dead weight
  const downedInFight = Object.values(players).filter(p => p.status === 'downed');
  const carryingNote = downedInFight.length > 0
    ? `\n\nCARRYING BURDEN: ${downedInFight.map(p=>p.name).join(', ')} ${downedInFight.length === 1 ? 'is' : 'are'} unconscious and being physically carried by the active party. This is a real tactical and physical burden — it limits mobility, divides attention, and makes everything harder. Factor this into the difficulty and tone. The party cannot achieve a GOOD outcome without their choices explicitly addressing how they're managing the dead weight.`
    : '';
  const revivedByMags = scData?.type === 'shop'
    ? Object.values(players).filter(p => p.choiceId === 'mags_revived').map(p => p.name)
    : [];
  const magsReviveNote = revivedByMags.length > 0
    ? ` ${revivedByMags.join(' and ')} ${revivedByMags.length === 1 ? 'was' : 'were'} unconscious when they arrived — Mags patched them up with minimal ceremony (15 HP). Reference this: it cost Mags supplies she'd rather have kept.`
    : '';
  const shopNote = scData?.type === 'shop'
    ? `\n\nThis is the merchant checkpoint scene. Each player either bought one item or passed. Reference what each person bought (or did not) and how they interacted with Mags. The rest alcove gives everyone a small HP recovery — work that in naturally. Gerald is in the corner if he survived.${magsReviveNote}`
    : '';
  const riddleNote = scData?.type === 'riddle'
    ? (() => {
        const ps = state.players || {};
        const riddleMap = { Bart:'fire', Melissa:'key', Noah:'shadow', Leah:'door' };
        const riddleLines = {
          fire:   '"I have no mouth but I speak to every dark place..."',
          key:    '"I am nothing without a match..."',
          shadow: '"I follow you everywhere and arrive before you do..."',
          door:   '"I am the difference between here and there..."',
        };
        const results = Object.values(ps).map(p => {
          if (p.status === 'downed') return null;
          const riddle  = riddleMap[p.archetype] || '?';
          const correct = p.choiceId === 'correct';
          const answer  = p.choice ? p.choice.replace('Answered correctly: ','').replace('Answered: ','') : '?';
          return `  ${p.name} — riddle: ${riddle} (${riddleLines[riddle]||''}) — answered: ${answer} — ${correct ? '✓ CORRECT' : '✗ WRONG'}`;
        }).filter(Boolean).join('\n');

        const correctCount = state.riddleCorrectCount ?? Object.values(ps).filter(p => p.choiceId === 'correct').length;
        const totalActive  = state.riddleTotalActive  ?? Object.values(ps).filter(p => p.status !== 'downed').length;
        const opened = state.riddleSolved;

        const trackDesc = correctCount === totalActive
          ? 'All four answered correctly. The door opened cleanly.'
          : correctCount >= Math.ceil(totalActive / 2)
            ? `${correctCount} of ${totalActive} answered correctly — majority sufficient. The door grinds open.`
            : `Only ${correctCount} of ${totalActive} answered correctly. The door discharged punishment and opened anyway via Syndicate liability clause.`;

        return `\n\nSYNDICATE PUZZLE LOCK — SCENE 8:
CRITICAL: The riddle ANSWERS are single common nouns: fire, key, shadow, door. These are NOT player names and NOT related to who the players are. They are the answers to four separate riddles about those objects.

Each player was shown a unique riddle on their screen. They had to talk out loud to each other to share what they heard and figure out all four answers together.

INDIVIDUAL RESULTS:
${results}

OUTCOME: ${trackDesc}
${opened ? 'The door is open.' : 'All attempts exhausted. The door opened via Syndicate liability clause — mandatory passage clause, sub-section 7.'}

In your narrative: name which players got their riddle right and which got it wrong. Reference the specific riddle topic (fire, shadow, etc.) for each player. Do NOT imply the answers had anything to do with the players' identities or names.`;
      })()
    : '';

  // Combat context
  let combatContext = '';
  if (scData?.combatData) {
    const maxHp = scData.combatData.maxHp;
    const prevHp = state.combat?.enemyHp ?? maxHp;
    const history = state.combat?.history ? Object.values(state.combat.history) : [];
    const historyText = history.length ? `\n\nPREVIOUS ROUNDS:\n${history.join('\n---\n')}` : '';
    const phase2Flag = enteringPhase2
      ? '\n\n⚠ PHASE 2 TRIGGERED THIS ROUND: Krag uses the Syndicate Emergency Enhancement Serum. His eyes go red. His attacks get faster. He stops trying to finish his speech. Narrate this transition dramatically.'
      : (state.combat?.phase2 ? '\n\n[PHASE 2 ACTIVE — Krag is enhanced, attacks harder]' : '');
    const statusLine = newEnemyHp <= 0
      ? `✓ ENEMIES DEFEATED THIS ROUND — narrate their defeat conclusively.`
      : combatContinues
        ? `⚔ COMBAT CONTINUES — enemies still at ${newEnemyHp}/${maxHp} HP. End your narrative mid-fight, with momentum. Do NOT resolve the combat.`
        : `✓ COMBAT ENDS.`;
    combatContext = `\n\nCOMBAT STATE (Round ${combatRound}):
Enemy: ${scData.combatData.name} — HP going into this round: ${prevHp}/${maxHp}. After party damage: ${newEnemyHp}/${maxHp}.
THESE HP VALUES ARE EXACT AND AUTHORITATIVE. Use them verbatim. Do not round, estimate, or use different numbers.
${statusLine}${phase2Flag}${historyText}`;
  }

  // ── Previous scene context — track + narration handoff for continuity ──
  let prevSceneContext = '';
  if (scene > 3) {
    const prevEntry = (fbState.narrationHistory || {})[`scene${scene - 1}`];
    if (prevEntry) {
      const trackLine  = prevEntry.track   ? `The previous scene resolved on a ${prevEntry.track.toUpperCase()} track.` : '';
      prevSceneContext = `\n\nPREVIOUS SCENE CONTEXT:\n${trackLine}\nOpen your narration with a line or two that carries momentum from that scene into this one — not a recap, just the feeling of continued motion. The party does not teleport between scenes. Something from before should still be in the air.`;
    }
  }

  const prompt = `SCENE ${scene}: ${scData?.name || ''}
${scData?.desc || ''}

PLAYER CHOICES:
${party}

OUTCOME TRACK: ${hasFreeform ? '[Claude determines — see FREEFORM CHOICES IN PLAY above]' : `${track.toUpperCase()} — ${hint[track]||''}`}${outcomeSummary}${goldSummary}${shopNote}${riddleNote}${itemSummary}${carryingNote}${kragPrepNote}${combatContext}${freeformContext}${bearNote}${geraldNote}${prevSceneContext}

YOUR RESPONSE MUST HAVE EXACTLY TWO SECTIONS SEPARATED BY ---SYSTEM---

SECTION 1 — THE NARRATIVE (2 paragraphs):
Tell the story of what happened. Reference every player by name. Make their choices feel real. No mechanical announcements here — just the scene unfolding. Do not mention damage numbers or gold amounts in this section.

---SYSTEM---

SECTION 2 — THE SYSTEM VERDICT (3-6 lines, terminal voice):
THE SYSTEM delivers its verdict. Use EXACTLY the HP numbers provided above — do not recalculate or approximate.
- One line per player who took damage: "DAMAGE: [Name] — [amount] damage. HP: [new]/[max]." (use the exact values from ACTUAL DAMAGE/HEALING above)
- One line if gold was found: "GOLD: Each survivor finds [amount]g."
- One line if anyone is downed: "[Name] is down. THE SYSTEM notes this."
- One optional achievement if truly earned: "NEW ACHIEVEMENT! [Title] — [one line]."
- One final status line: dry, blunt, THE SYSTEM voice.
If nothing bad happened, keep it short. THE SYSTEM does not pad.`;

  // ── Game over detection — if all active players will hit 0 HP this round ──
  const activePlayers = Object.entries(players).filter(([, p]) => p.status === 'active');
  const allDownAfter = activePlayers.length > 0 && activePlayers.every(([id, p]) => {
    const d = deltas[id] || 0;
    return Math.max(0, (p.hp || 0) + d) <= 0;
  });

  if (allDownAfter) {
    await fireGameOverNarration(state, scene, scData, players, deltas, track);
    return;
  }
  // When freeform choices are in play, Claude determines the track, so we skip this
  // and write combat HP after parsing Claude's response instead.
  if (scData?.combatData && newEnemyHp !== null && !hasFreeform) {
    const earlyUpd = {
      'combat/enemyHp':   newEnemyHp,
      'combat/continues': combatContinues || null,
      'combat/round':     combatRound,
      ...(enteringPhase2 ? { 'combat/phase2': true } : {}),
      [`combat/history/round${combatRound}`]: `Round ${combatRound}: Enemy HP ${Math.round((newEnemyHp / scData.combatData.maxHp) * 100)}% remaining. ${combatContinues ? 'Fight continues.' : 'Defeated.'}`,
    };
    // Write maxEnemyHp on round 1 so the HP bar always has it
    if (combatRound === 1) earlyUpd['combat/maxEnemyHp'] = scData.combatData.maxHp;
    await ROOT.update(earlyUpd);
  }

  try {
    // Build multi-turn message history so Claude remembers prior narrations
    const history = fbState.narrationHistory || {};
    const historyMessages = [];
    for (let s = Math.max(1, scene - 3); s < scene; s++) {
      const entry = history[`scene${s}`];
      if (!entry?.text) continue;
      const assistantContent = entry.verdict
        ? `${entry.text}\n\n---SYSTEM---\n${entry.verdict}`
        : entry.text;
      const trackLine  = entry.track   ? ` — Track: ${entry.track}`         : '';
      const choiceLine = entry.choices ? `\nChoices: ${entry.choices}` : '';
      historyMessages.push({ role: 'user',      content: `[Scene ${s}${trackLine}]${choiceLine}` });
      historyMessages.push({ role: 'assistant', content: assistantContent });
    }
    historyMessages.push({ role: 'user', content: prompt });

    const raw = await callClaude(prompt, historyMessages);

    // Split on separator
    const sepIdx = raw.indexOf('---SYSTEM---');
    const narrative = sepIdx > -1 ? raw.substring(0, sepIdx).trim() : raw.trim();
    let verdict     = sepIdx > -1 ? raw.substring(sepIdx + 12).trim() : '';

    // ── Parse track from Claude response when freeform was in play ──
    let resolvedTrack = track;
    if (hasFreeform) {
      const trackMatch = verdict.match(/^TRACK:\s*(good|neutral|bad)/im);
      if (trackMatch) {
        resolvedTrack = trackMatch[1].toLowerCase();
        // Strip the TRACK line from the verdict so it doesn't show to players
        verdict = verdict.replace(/^TRACK:\s*(good|neutral|bad)\s*\n?/im, '').trim();
      }
      // Recalculate deltas and combat HP now that we know the actual track
      if (scData?.applyOutcome) {
        const recalcDeltas = scData.applyOutcome(players, resolvedTrack);
        Object.assign(deltas, recalcDeltas);
      }
      if (scData?.combatData) {
        const recalcDmg = scData.combatData.partyDamage(choiceMap, resolvedTrack, players);
        const prevEnemyHp = state.combat?.enemyHp ?? scData.combatData.maxHp;
        newEnemyHp = Math.max(0, prevEnemyHp - recalcDmg);
        combatContinues = newEnemyHp > 0 && Object.values(players).some(p => p.status === 'active');
        // Write the recalculated combat HP now (was skipped pre-Claude for freeform)
        const freeformCombatUpd = {
          'combat/enemyHp':   newEnemyHp,
          'combat/continues': combatContinues || null,
          'combat/round':     combatRound,
          ...(combatRound === 1 ? { 'combat/maxEnemyHp': scData.combatData.maxHp } : {}),
        };
        await ROOT.update(freeformCombatUpd);
      }
    }

    // Build pendingHp as { playerId: { hp, status?, gold? } } — no slashes in keys,
    // which Firebase rejects when storing as a document value (slashes only work in update() paths).
    // IMPORTANT: use `players` (same state Claude narrated from), NOT a fresh Firebase snap.
    // A fresh snap could have drifted, making the stored HP differ from what Claude described.
    const pendingHp = {};
    const goldLoot  = deltas.__goldLoot || 0;

    Object.entries(deltas).forEach(([id, d]) => {
      if (id === '__goldLoot') return;
      const current = players[id]?.hp ?? 0;
      const maxHp   = players[id]?.maxHp || current;
      const newHp   = Math.min(maxHp, Math.max(0, current + d));
      if (!pendingHp[id]) pendingHp[id] = {};
      pendingHp[id].hp = newHp;
      if (newHp <= 0) pendingHp[id].status = 'downed';
      // Revival: downed player gets healed above 0 — restore to active
      if (newHp > 0 && players[id]?.status === 'downed') pendingHp[id].status = 'active';
    });

    if (goldLoot > 0) {
      Object.keys(players).forEach(id => {
        if (players[id]?.status === 'downed') return;
        if (!pendingHp[id]) pendingHp[id] = {};
        pendingHp[id].gold = (players[id].gold || 0) + goldLoot;
      });
    }

    await ROOT.update({
      'narration/text':       narrative,
      'narration/verdict':    verdict,
      'narration/scene':      scene,
      'narration/track':      track,
      'narration/timestamp':  Date.now(),
      'narration/generating': false,
      'narration/pendingHp':  Object.keys(pendingHp).length ? pendingHp : null,
      'session/phase':        'scene_complete',
      // Persist narration for continuity — Claude reads last 3 scenes before writing the next
      [`narrationHistory/scene${scene}/text`]:    narrative,
      [`narrationHistory/scene${scene}/verdict`]: verdict,
      [`narrationHistory/scene${scene}/track`]:   track,
      [`narrationHistory/scene${scene}/choices`]: Object.values(players)
        .filter(p => p.name && p.choice)
        .map(p => `${p.name}: ${p.choice}`)
        .join(' | '),
      // Write kragPrep when scene 10 resolves so Krag fight can read it
      ...(scene === 10 ? { 'session/kragPrep': track } : {}),
    });
  } catch(e) {
    await lock.remove();
    ROOT.update({
      'narration/text': `THE SYSTEM has experienced a critical malfunction.\n[${e.message}]\nUse GM panel to continue.`,
      'narration/generating': false,
      'session/phase': 'scene_complete',
    });
  }
}

// ═══════════════════════════════════════════════════════
//  GAME OVER NARRATION
// ═══════════════════════════════════════════════════════
async function fireGameOverNarration(state, scene, scData, players, deltas, track) {
  if (!isGM) return;

  // Release the narration lock so a GM reset doesn't leave it permanently set
  await ROOT.child(`narrationLock/scene${scene}`).remove();

  ROOT.update({ 'session/phase': 'narrating', 'narration/generating': true });

  // Calculate final HP for each player
  const finalHp = {};
  Object.entries(players).forEach(([id, p]) => {
    const d = deltas[id] || 0;
    finalHp[id] = Math.max(0, (p.hp || 0) + d);
  });

  const partyLines = Object.values(players).map(p =>
    `${p.name} (${p.title||p.archetype}) — final HP: ${finalHp[Object.keys(players).find(id=>players[id]===p)] ?? 0}/${p.maxHp}`
  ).join('\n');

  const prompt = `SCENE ${scene} — TOTAL PARTY KNOCKOUT

The entire party has been reduced to 0 HP.

THE PARTY (last known state):
${partyLines}

Scene context: ${scData?.desc?.substring(0, 200) || scData?.name || ''}

THE SYSTEM has observed many total party knockouts. Most of them were more dignified than this one.

Write a game over narration:
SECTION 1 (2 paragraphs): Narrate the party going down — all of them, one by one or all at once. Make it feel real. The dungeon won. Name who went down how.

---SYSTEM---

SECTION 2 — GAME OVER VERDICT (THE SYSTEM voice, maximum sarcasm):
THE SYSTEM has watched thousands of parties die in this dungeon. This one rates a mention — not for bravery, but for the specific sequence of decisions that led here. THE SYSTEM delivers its final assessment of the run so far. Personal. Specific. Cutting. But not without a grudging note of: at least they tried.

End with: "GAME OVER. Floor 1 — The Goblin Antechamber. THE SYSTEM suggests a debrief."

Keep it under 10 lines. THE SYSTEM is efficient even in failure.`;

  try {
    const raw = await callClaude(prompt);
    const sepIdx  = raw.indexOf('---SYSTEM---');
    const narrative = sepIdx > -1 ? raw.substring(0, sepIdx).trim() : raw.trim();
    const verdict   = sepIdx > -1 ? raw.substring(sepIdx + 12).trim() : 'GAME OVER. THE SYSTEM has no further comment.';

    // Mark all players downed
    const downUpd = {};
    Object.keys(players).forEach(id => {
      downUpd[`players/${id}/hp`]     = 0;
      downUpd[`players/${id}/status`] = 'downed';
    });

    ROOT.update({
      'narration/text':       narrative,
      'narration/verdict':    verdict,
      'narration/scene':      scene,
      'narration/generating': false,
      'session/phase':        'game_over',
      ...downUpd,
    });
  } catch(e) {
    ROOT.update({
      'narration/text':       'THE SYSTEM has lost the signal. Everyone is down.\n[Error: ' + e.message + ']',
      'narration/generating': false,
      'session/phase':        'game_over',
    });
  }
}
const txCanvas = document.createElement('canvas');
txCanvas.style.cssText = 'position:fixed;inset:0;z-index:400;pointer-events:none;';
document.body.appendChild(txCanvas);
const txCtx = txCanvas.getContext('2d');
function resizeTx() { txCanvas.width = window.innerWidth; txCanvas.height = window.innerHeight; }
resizeTx(); window.addEventListener('resize', resizeTx);

function showTransition(toScene, callback) {
  const W = txCanvas.width, H = txCanvas.height;
  const animDuration = 4800;   // animation phase — longer, more cinematic
  const holdDuration  = 800;   // hold black after animation
  const fadeDuration  = 900;   // fade out to reveal new scene
  // Keys = scene being entered. Each animation previews what you're about to face.
  const draws = { 2:txTrapCorridor, 3:txTrapCorridor, 4:txGerald,      5:txAmbush,
                  6:txDarkness,     7:txMags,          8:txRiddleWall,  9:txElites,
                  10:txBoss,        11:txBoss,          12:txVictory };
  const draw = draws[toScene] || txCorridorRush;
  let raf;
  let phase = 'anim'; // 'anim' → 'hold' → 'fadeout'
  let phaseStart = performance.now();
  let callbackFired = false;

  function frame(now) {
    const elapsed = now - phaseStart;

    if (phase === 'anim') {
      const t = Math.min(elapsed / animDuration, 1);
      // Fade in over first 8%, hold full, fade to black over last 12%
      const alpha = t < 0.08 ? t/0.08 : t > 0.88 ? 1 : 1;
      const toBlack = t > 0.92 ? (t - 0.92) / 0.08 : 0;
      txCtx.clearRect(0,0,W,H);
      txCtx.save(); txCtx.globalAlpha = alpha;
      draw(txCtx, t, W, H, now);
      txCtx.restore();
      // Overlay to black at end of animation
      if (toBlack > 0) {
        txCtx.fillStyle = `rgba(0,0,0,${toBlack})`;
        txCtx.fillRect(0,0,W,H);
      }
      if (t >= 1) { phase = 'hold'; phaseStart = now; }

    } else if (phase === 'hold') {
      // Solid black — fire callback here so Firebase loads new content during hold
      txCtx.fillStyle = '#000';
      txCtx.fillRect(0,0,W,H);
      if (!callbackFired) { callbackFired = true; if (callback) callback(); }
      if (elapsed >= holdDuration) { phase = 'fadeout'; phaseStart = now; }

    } else if (phase === 'fadeout') {
      // Fade black overlay out to reveal the new scene underneath
      const ft = Math.min(elapsed / fadeDuration, 1);
      const alpha = 1 - ft;
      txCtx.clearRect(0,0,W,H);
      if (alpha > 0) {
        txCtx.fillStyle = `rgba(0,0,0,${alpha})`;
        txCtx.fillRect(0,0,W,H);
      }
      if (ft >= 1) { txCtx.clearRect(0,0,W,H); return; } // done
    }

    raf = requestAnimationFrame(frame);
  }

  if (raf) cancelAnimationFrame(raf);
  phaseStart = performance.now();
  raf = requestAnimationFrame(frame);
}

// ── helpers ──
function txFillBg(ctx, W, H, col='#040302') { ctx.fillStyle=col; ctx.fillRect(0,0,W,H); }
function txTorch(ctx, x, y, r, t) {
  const flicker = 0.75 + Math.sin(t*0.013+x)*0.15 + Math.sin(t*0.021+y)*0.1;
  const g = ctx.createRadialGradient(x,y,0,x,y,r*flicker);
  g.addColorStop(0,`rgba(255,170,50,${0.9*flicker})`);
  g.addColorStop(0.35,`rgba(220,100,20,${0.5*flicker})`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r*flicker*1.4,0,Math.PI*2); ctx.fill();
}
function txPerspLines(ctx, cx, cy, W, H, col='rgba(60,40,20,0.3)', n=16) {
  ctx.strokeStyle=col; ctx.lineWidth=1;
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(a)*W, cy+Math.sin(a)*H);
    ctx.stroke();
  }
}
function txSilhouette(ctx, path, col='#080604') {
  ctx.fillStyle=col; ctx.beginPath();
  path(ctx); ctx.fill();
}
function txText(ctx, txt, x, y, col='rgba(200,150,50,0.8)', size=22, font='Cinzel,serif') {
  ctx.fillStyle=col; ctx.font=`${size}px ${font}`; ctx.textAlign='center';
  ctx.shadowBlur=12; ctx.shadowColor=col; ctx.fillText(txt,x,y); ctx.shadowBlur=0;
}

// ── GENERIC: Corridor Rush ──
function txCorridorRush(ctx, t, W, H, now) {
  txFillBg(ctx,W,H,'#040302');
  const cx=W/2, cy=H/2;
  const zoom = 0.3 + t*1.4;
  // Stone walls via perspective quad
  const hw=W*0.38/zoom, hh=H*0.42/zoom;
  ctx.fillStyle='#100c07';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(cx-hw,cy-hh); ctx.lineTo(cx-hw,cy+hh); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#0e0a06';
  ctx.beginPath(); ctx.moveTo(W,0); ctx.lineTo(cx+hw,cy-hh); ctx.lineTo(cx+hw,cy+hh); ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#080604';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(cx-hw,cy-hh); ctx.lineTo(cx+hw,cy-hh); ctx.lineTo(W,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#0c0905';
  ctx.beginPath(); ctx.moveTo(0,H); ctx.lineTo(cx-hw,cy+hh); ctx.lineTo(cx+hw,cy+hh); ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  // Center passage
  ctx.fillStyle='#1a1208';
  ctx.beginPath(); ctx.rect(cx-hw,cy-hh,hw*2,hh*2); ctx.fill();
  // Torches
  for(let i=0;i<3;i++){
    const d=((i+t*1.4)%3)/3;
    const s=Math.max(0.05,1-d*0.85);
    txTorch(ctx, cx-hw*(1-d)*0.85, cy-(hh*(1-d)*0.6), 55*s, now);
    txTorch(ctx, cx+hw*(1-d)*0.85, cy-(hh*(1-d)*0.6), 55*s, now);
  }
  // Motion lines
  ctx.strokeStyle='rgba(80,55,25,0.12)'; ctx.lineWidth=1.5;
  for(let i=0;i<24;i++){
    const a=(i/24)*Math.PI*2, len=30+t*180;
    ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*18,cy+Math.sin(a)*18);
    ctx.lineTo(cx+Math.cos(a)*(18+len),cy+Math.sin(a)*(18+len)); ctx.stroke();
  }
  // Vignette
  const vig=ctx.createRadialGradient(cx,cy,H*0.2,cx,cy,H*0.85);
  vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(0,0,0,0.85)');
  ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);
}

// ── SCENE 2: Pressure Plate ──
function txTrapCorridor(ctx, t, W, H, now) {
  txFillBg(ctx,W,H,'#060402');
  txCorridorRush(ctx, Math.min(t*0.5,0.4), W, H, now);
  // Floor plate in center
  const px=W/2, py=H*0.72, pw=W*0.18, ph=H*0.06;
  const press = t > 0.4 ? Math.min((t-0.4)/0.3, 1) : 0;
  ctx.fillStyle=`rgba(80,60,30,${0.6+press*0.3})`;
  ctx.fillRect(px-pw/2, py-ph/2+press*8, pw, ph);
  ctx.strokeStyle=`rgba(180,140,60,${0.4+press*0.5})`; ctx.lineWidth=2;
  ctx.strokeRect(px-pw/2, py-ph/2+press*8, pw, ph);
  if(press > 0) {
    // Cracks
    ctx.strokeStyle=`rgba(200,160,80,${press*0.8})`; ctx.lineWidth=1.5;
    const cracks=[[0,-1],[1,-0.5],[-1,-0.7],[0.5,1],[-0.8,0.6]];
    cracks.forEach(([dx,dy])=>{
      ctx.beginPath(); ctx.moveTo(px,py+press*8);
      ctx.lineTo(px+dx*pw*0.8+Math.random()*10,py+dy*ph*2+press*8); ctx.stroke();
    });
    // Glow
    const g=ctx.createRadialGradient(px,py,0,px,py,pw*1.2);
    g.addColorStop(0,`rgba(255,180,40,${press*0.4})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(px-pw,py-ph,pw*2,ph*3);
    // Dust
    for(let i=0;i<20;i++){
      const a=(i/20)*Math.PI*2, spd=press*(30+Math.sin(i)*20);
      const dx2=Math.cos(a)*spd*(t-0.4), dy2=Math.sin(a)*spd*(t-0.4)-press*15;
      ctx.beginPath(); ctx.arc(px+dx2,py+dy2,Math.max(0.1,1.5*(1-press*0.5)),0,Math.PI*2);
      ctx.fillStyle=`rgba(180,150,80,${press*0.6*(1-t)})`; ctx.fill();
    }
  }
  txText(ctx,'...',W/2,H*0.15);
}

// ── SCENE 3: Gerald ──
function txGerald(ctx, t, W, H, now) {
  txFillBg(ctx,W,H,'#030201');
  // Alcove walls
  ctx.fillStyle='#0e0a06';
  ctx.beginPath(); ctx.roundRect(W*0.1,H*0.05,W*0.8,H*0.88,16); ctx.fill();
  ctx.fillStyle='#060402';
  ctx.beginPath(); ctx.roundRect(W*0.15,H*0.1,W*0.7,H*0.78,10); ctx.fill();
  // Torch flicker
  txTorch(ctx,W/2,H*0.18,70,now);
  // Two barrels in corner
  const bx=W*0.65, by=H*0.62;
  ctx.fillStyle='#1e1408';
  ctx.beginPath(); ctx.ellipse(bx,by,28,38,0.15,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(bx+30,by+8,24,32,-0.1,0,Math.PI*2); ctx.fill();
  // Barrel rings
  ctx.strokeStyle='rgba(80,55,25,0.6)'; ctx.lineWidth=2;
  [-12,0,12].forEach(dy => {

  });

  const gx=W*0.58, gy=H*0.7;

  // Body slumped
  ctx.beginPath(); ctx.ellipse(gx,gy+breathe,20,28,-0.2,0,Math.PI*2); ctx.fill();
  // Knees drawn up
  ctx.beginPath(); ctx.ellipse(gx-8,gy-16+breathe,14,10,0.5,0,Math.PI*2); ctx.fill();

  ctx.fillStyle='#c8986a'; // skin tone
  ctx.beginPath(); ctx.arc(gx-4,gy-38+breathe,16,0,Math.PI*2); ctx.fill();

  ctx.fillStyle='#3a2a18';

    ctx.strokeRect(gx+12, gy-22+breathe, 18, 10);
  }
  // Partial map on his lap — paper
  const mt = Math.min((t-0.2)*3, 1);

    ctx.beginPath(); ctx.roundRect(gx-18,gy-10+breathe,28,20,2); ctx.fill();
    // Map lines
    ctx.strokeStyle=`rgba(80,60,30,${mt*0.5})`; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(gx-14,gy-4+breathe); ctx.lineTo(gx+6,gy-4+breathe); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(gx-14,gy+2+breathe); ctx.lineTo(gx,gy+2+breathe); ctx.stroke();
  }

  // Vignette
  const vig=ctx.createRadialGradient(W/2,H/2,H*0.15,W/2,H/2,H*0.72);
  vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(0,0,0,0.92)');

// ── SCENE 4: Goblin Ambush ──
function txAmbush(ctx, t, W, H, now) {
  txFillBg(ctx,W,H,'#0a0302');
  // Background red tint
  ctx.fillStyle=`rgba(100,10,5,${Math.min(t*2,0.3)})`;
  ctx.fillRect(0,0,W,H);
  // Dropping goblin silhouettes
  const goblins=[{x:0.25,delay:0},{x:0.5,delay:0.18},{x:0.75,delay:0.09}];
  goblins.forEach(({x,delay})=>{
    const gt = Math.max(0, Math.min((t-delay)/0.72, 1));
    const gy = H*(-0.12) + gt*H*0.75;
    const gx = W*x;
    // Rope/trail
    if(gt < 0.9) {
      ctx.strokeStyle=`rgba(80,55,25,${0.5*(1-gt)})`; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,gy-30); ctx.stroke();
    }
    // Body
    ctx.fillStyle='#1a0e06';
    ctx.beginPath(); ctx.ellipse(gx,gy,16,22,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(gx,gy-28,12,0,Math.PI*2); ctx.fill();
    // Weapon glint
    if(gt > 0.5) {
      ctx.strokeStyle=`rgba(200,180,100,${(gt-0.5)*1.5})`; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(gx+12,gy-10); ctx.lineTo(gx+28,gy-35); ctx.stroke();
    }
  });
  // Big slash effect
  const slashT = Math.max(0,Math.min((t-0.45)/0.25,1));
  if(slashT > 0) {
    ctx.save(); ctx.globalAlpha=slashT*(1-Math.max(0,(t-0.6)/0.25));
    ctx.strokeStyle='rgba(220,40,20,0.9)'; ctx.lineWidth=6;
    ctx.shadowBlur=20; ctx.shadowColor='rgba(255,50,20,0.8)';
    ctx.beginPath(); ctx.moveTo(W*0.1,H*0.25); ctx.lineTo(W*0.9,H*0.7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W*0.15,H*0.6); ctx.lineTo(W*0.85,H*0.2); ctx.stroke();
    ctx.restore();
  }
  // Impact flash
  if(t > 0.3 && t < 0.5) {
    ctx.fillStyle=`rgba(255,80,20,${(0.5-t)*0.5})`;
    ctx.fillRect(0,0,W,H);
  }
  const opacity = t > 0.42 ? Math.min((t-0.42)/0.22,1) : 0;
  txText(ctx,'AMBUSH.',W/2,H*0.88,`rgba(220,80,40,${opacity})`,28);
  const vig=ctx.createRadialGradient(W/2,H/2,H*0.1,W/2,H/2,H*0.8);
  vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(0,0,0,0.88)');
  ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);
}

// ── SCENE 5: Darkness / Kobold Ambush ──
function txDarkness(ctx, t, W, H, now) {
  // Start lit, then lights go out
  const lightOut = t > 0.25 ? Math.min((t-0.25)/0.18, 1) : 0;
  const darkness = lightOut;

  // Room when lit
  if (lightOut < 1) {
    const lit = 1 - lightOut;
    txFillBg(ctx, W, H, `rgb(${Math.floor(14*lit)},${Math.floor(10*lit)},${Math.floor(6*lit)})`);
    // Torches on walls
    [W*0.15, W*0.85].forEach(tx2 => {
      txTorch(ctx, tx2, H*0.3, 60*(1-lightOut*0.8), now);
    });
    // Wall lines
    ctx.strokeStyle=`rgba(50,35,18,${lit*0.4})`; ctx.lineWidth=1;
    for(let i=0;i<6;i++){
      ctx.beginPath(); ctx.moveTo(0,H*0.15*i); ctx.lineTo(W,H*0.15*i); ctx.stroke();
    }
  }

  // Darkness taking over
  if (lightOut > 0) {
    ctx.fillStyle=`rgba(0,0,0,${lightOut*0.98})`;
    ctx.fillRect(0,0,W,H);
  }

  // Glowing reptilian eyes appearing in the dark
  if (t > 0.5) {
    const eyeT = (t - 0.5) / 0.5;
    const eyePairs = [
      {x:W*0.2, y:H*0.45}, {x:W*0.75, y:H*0.38},
      {x:W*0.5, y:H*0.55}, {x:W*0.35, y:H*0.32},
      {x:W*0.65, y:H*0.6},
    ];
    eyePairs.forEach(({x,y}, i) => {
      const delay = i * 0.12;
      const et = Math.max(0, Math.min((eyeT - delay) / 0.2, 1));
      if (et <= 0) return;
      // Blink
      const blink = Math.sin(now*0.007 + i*1.4) > 0.85 ? 0 : 1;
      const alpha = et * blink * 0.9;
      // Glow
      const gl = ctx.createRadialGradient(x,y,0,x,y,30);
      gl.addColorStop(0,`rgba(120,220,60,${alpha*0.3})`);
      gl.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=gl; ctx.fillRect(x-35,y-35,70,70);
      // Eyes
      ctx.fillStyle=`rgba(120,220,60,${alpha})`;
      ctx.shadowBlur=8*et; ctx.shadowColor=`rgba(100,200,50,0.8)`;
      ctx.beginPath(); ctx.ellipse(x-7,y,5,3,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x+7,y,5,3,0,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
    });
  }

  // Syndicate notification text
  const msgT = t > 0.35 && t < 0.55 ? Math.min((t-0.35)/0.08, 1) * (1-Math.max(0,(t-0.45)/0.08)) : 0;
  if (msgT > 0) {
    txText(ctx,'[ TORCH TIMER: 0:00 — Feature added in patch 2.3 ]',W/2,H*0.12,
      `rgba(180,220,180,${msgT*0.8})`,14,'Share Tech Mono,monospace');
  }

  const opacity = t > 0.45 ? Math.min((t-0.45)/0.22,1) : 0;
  txText(ctx,'They can see in the dark.',W/2,H*0.88,`rgba(120,220,60,${opacity})`,20);
}

// ── SCENE 6: Mags the Merchant ──
function txMags(ctx, t, W, H, now) {
  txFillBg(ctx,W,H,'#060402');
  const warmT = Math.min(t*1.5,1);
  const g=ctx.createRadialGradient(W/2,H*0.55,0,W/2,H*0.55,H*0.6);
  g.addColorStop(0,`rgba(200,130,40,${warmT*0.25})`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // Cart rolling in from right
  const cartX = W*1.1 - t*W*0.52;
  ctx.fillStyle='#1a1008';
  ctx.beginPath(); ctx.roundRect(cartX-60,H*0.52,120,60,6); ctx.fill();
  ctx.strokeStyle='#2a1a08'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.arc(cartX-35,H*0.62,22,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cartX+35,H*0.62,22,0,Math.PI*2); ctx.stroke();

// ── SCENE 6 (old): Riddle Wall — kept for potential future use ──
function txRiddleWall(ctx, t, W, H, now) {
  txFillBg(ctx,W,H,'#040302');
  const cx=W/2, cy=H*0.48;
  // Stone door
  const dw=W*0.38, dh=H*0.62;
  ctx.fillStyle='#1c1610';
  ctx.beginPath(); ctx.roundRect(cx-dw/2,cy-dh/2,dw,dh,8); ctx.fill();
  // Door arch
  ctx.fillStyle='#140f0a';
  ctx.beginPath(); ctx.ellipse(cx,cy-dh/2,dw/2,dh*0.15,0,Math.PI,0); ctx.fill();
  // Stone texture lines
  ctx.strokeStyle='rgba(60,45,25,0.5)'; ctx.lineWidth=1;
  for(let row=0;row<8;row++){
    const ry=cy-dh/2+row*(dh/8);
    ctx.beginPath(); ctx.moveTo(cx-dw/2,ry); ctx.lineTo(cx+dw/2,ry); ctx.stroke();
    const offset=row%2===0?0:dw/4;
    ctx.beginPath(); ctx.moveTo(cx-dw/2+offset,ry); ctx.lineTo(cx-dw/2+offset,ry+dh/8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+offset-dw/4,ry); ctx.lineTo(cx+offset-dw/4,ry+dh/8); ctx.stroke();
  }
  // Four runes lighting up sequentially
  const runePositions=[{x:cx-dw*0.22,y:cy-dh*0.18},{x:cx+dw*0.22,y:cy-dh*0.18},
                       {x:cx-dw*0.22,y:cy+dh*0.1},{x:cx+dw*0.22,y:cy+dh*0.1}];
  const runeSymbols=['ᚱ','ᚢ','ᚾ','ᛖ'];
  const runeColors=['rgba(100,180,255,','rgba(180,100,255,','rgba(100,255,180,','rgba(255,180,100,'];
  runePositions.forEach(({x,y},i)=>{
    const rt = Math.max(0,Math.min((t-(i*0.18))/0.25,1));
    if(rt > 0){
      const gl=ctx.createRadialGradient(x,y,0,x,y,30);
      gl.addColorStop(0,`${runeColors[i]}${rt*0.5})`);
      gl.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=gl; ctx.fillRect(x-35,y-35,70,70);
      ctx.fillStyle=`${runeColors[i]}${rt*0.9})`;
      ctx.font=`bold ${28*rt}px serif`; ctx.textAlign='center';
      ctx.shadowBlur=12*rt; ctx.shadowColor=`${runeColors[i]}0.8)`;
      ctx.fillText(runeSymbols[i],x,y+10); ctx.shadowBlur=0;
    }
  });
  // All runes lit — door glow
  if(t > 0.75){
    const glow = (t-0.75)/0.25;
    const dg=ctx.createRadialGradient(cx,cy,0,cx,cy,dw*0.7);
    dg.addColorStop(0,`rgba(200,220,255,${glow*0.15})`);
    dg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=dg; ctx.fillRect(0,0,W,H);
  }
  const opacity = t > 0.40 ? Math.min((t-0.40)/0.22,1) : 0;
  txText(ctx,'ANSWER TOGETHER.',W/2,H*0.9,`rgba(180,200,255,${opacity})`,20);
  const vig=ctx.createRadialGradient(cx,cy,dh*0.2,cx,cy,H*0.85);
  vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(0,0,0,0.9)');
  ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);
}

// ── SCENE 8: Elite Guard ──
function txElites(ctx, t, W, H, now) {

  ctx.fillStyle=`rgba(80,10,5,${Math.min(t*0.8,0.2)})`;
  ctx.fillRect(0,0,W,H);
  txCorridorRush(ctx,0.25,W,H,now);

  const advance = Math.min(t/0.7,1);
  const elites=[{x:W*0.3,flip:-1},{x:W*0.7,flip:1}];
  elites.forEach(({x,flip},ei)=>{
    const delay = ei*0.08;
    const et = Math.max(0,Math.min((t-delay)/0.65,1));
    const ey = H*0.15 + (1-et)*H*0.12;
    const scale = 0.7 + et*0.45;
    ctx.save(); ctx.translate(x,ey); ctx.scale(flip*scale,scale);
    ctx.fillStyle='#1e1408';
    // Body/armor
    ctx.beginPath(); ctx.ellipse(0,H*0.45,30,55,0,0,Math.PI*2); ctx.fill();

    ctx.beginPath(); ctx.ellipse(28,H*0.28,20,15,-0.4,0,Math.PI*2); ctx.fill();
    // Head with helmet
    ctx.beginPath(); ctx.arc(0,H*0.2,24,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#0a0804';
    ctx.beginPath(); ctx.ellipse(0,H*0.18,18,10,0,0,Math.PI*2); ctx.fill(); // visor shadow
    // Shield (first elite only in ei===0)
    if(ei===0){
      ctx.fillStyle='#2a1c0a';
      ctx.beginPath(); ctx.roundRect(32,H*0.22,28,55,4); ctx.fill();
      // Shield glint
      const glint=(Math.sin(now*0.009)+1)/2;
      ctx.strokeStyle=`rgba(200,170,80,${glint*et*0.8})`; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(36,H*0.26); ctx.lineTo(36,H*0.54); ctx.stroke();
    }
    // Weapon glint
    const wglint = t > 0.5 ? Math.sin(now*0.012)*0.5+0.5 : 0;
    ctx.strokeStyle=`rgba(180,160,80,${wglint*et})`; ctx.lineWidth=3;
    ctx.shadowBlur=8*wglint; ctx.shadowColor='rgba(220,200,100,0.6)';
    ctx.beginPath(); ctx.moveTo(-25,H*0.3); ctx.lineTo(-50,H*0.1); ctx.stroke();
    ctx.shadowBlur=0;
    ctx.restore();
  });

    const eg=(t-0.4)/0.4;

      ctx.fillStyle=`rgba(220,40,20,${eg*0.7})`;
      ctx.beginPath(); ctx.ellipse(x-8,H*0.34,4,3,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x+8,H*0.34,4,3,0,0,Math.PI*2); ctx.fill();
    });

  txText(ctx,'They are not embarrassed.',W/2,H*0.9,`rgba(200,80,60,${opacity})`,20);

  ctx.shadowBlur=0;

// ── SCENE 10: Victory ──

  ctx.shadowBlur=0;

  ['rgba(255,60,60,0.9)','rgba(60,140,255,0.9)','rgba(60,220,80,0.9)'].forEach((col,i)=>{

  // Full screen golden glow
  if(t > 0.6){
    const gt=(t-0.6)/0.4;
    ctx.fillStyle=`rgba(200,140,20,${gt*0.08})`;
    ctx.fillRect(0,0,W,H);
  }
}

    triggerReadyFlash();
    advanceToScene2();

function setReady2() {

    playAllReadySound();

    advanceToNextScene();
  }));

// ── Advance lock — atomic transaction prevents multiple tabs from double-firing ──
// Returns true if this tab claimed the advance; false if another tab beat us.
async function claimAdvance() {
  let claimed = false;
  await ROOT.child('session/advanceLock').transaction(cur => {
    if (cur) return undefined; // already claimed — abort transaction
    claimed = true;
    return Date.now();         // set a non-null value to claim
  });
  return claimed;
}

async function advanceToScene2() {
  if (!(await claimAdvance())) return; // another tab is handling this
  showTransition(2, () => {
    const ps = fbState.players || {};
    const upd = {
      'session/advanceLock': null,   // release lock
      readiness: null,
      'session/currentScene': 2,
      'session/phase': 'scene_intro',
      'narration/text': null, 'narration/verdict': null, 'narration/scene': null,
    };
    Object.keys(ps).forEach(id => {
      upd[`players/${id}/choice`] = null;
      upd[`players/${id}/choiceId`] = null;
      upd[`players/${id}/freeformChoice`] = null;
      upd[`players/${id}/bonusAction`] = null;
      upd[`players/${id}/bonusText`] = null;
      upd[`players/${id}/choiceSubmitted`] = false;
    });
    ROOT.update(upd);
  });
}

async function setContinue() {
  ROOT.child(`readiness/${myId}`).set(true).then(() => checkAllReady('scene_complete', async (s) => {
    if (!(await claimAdvance())) return;
    playAllReadySound();
    triggerReadyFlash();

    const upd = {
      'session/advanceLock': null,
      'session/phase': 'system_verdict',
      readiness: null,
      'narration/pendingHp': null,
    };

    // Unpack pendingHp from {playerId: {hp, status?, gold?}} into update paths
    const pending = s.narration?.pendingHp || {};
    Object.entries(pending).forEach(([id, fields]) => {
      Object.entries(fields).forEach(([field, val]) => {
        upd[`players/${id}/${field}`] = val;
      });
    });

    ROOT.update(upd);
  }));
}

async function setVerdictContinue() {
  ROOT.child(`readiness/${myId}`).set(true).then(() => checkAllReady('system_verdict', async (s) => {
    if (!(await claimAdvance())) return;
    playAllReadySound();
    triggerReadyFlash();

    // Use fresh snap — not fbState — to check combat state
    if (s.combat?.continues) {
      const ps = s.players || {};
      const nextRound = (s.combat?.round || 1) + 1;
      const curScene  = s.session?.currentScene;
      const upd = {
        'session/advanceLock': null,
        readiness: null,
        'narration/text': null, 'narration/verdict': null, 'narration/pendingHp': null,
        'combat/continues': null,
        'combat/round': nextRound,
        'session/phase': 'choosing',
      };
      upd[`narrationLock/scene${curScene}`] = null;
      Object.keys(ps).forEach(id => {
        upd[`players/${id}/choice`] = null;
        upd[`players/${id}/freeformChoice`] = null;
        upd[`players/${id}/bonusAction`] = null;
        upd[`players/${id}/bonusText`] = null;
        upd[`players/${id}/choiceId`] = null;
        upd[`players/${id}/choiceSubmitted`] = false;
      });
      ROOT.update(upd);
    } else {
      await advanceToNextScene(true); // lock already held — skip re-claim
    }
  }));
}

async function advanceToNextScene(lockAlreadyHeld = false) {
  if (!lockAlreadyHeld && !(await claimAdvance())) return;
  lastFullRenderPhase  = null; // force full render on next scene
  lastFullRenderScene  = null;
  lastFullRenderNarrTs = null;
  pendingBonus         = null; // clear any queued bonus action
  const cur  = fbState.session?.currentScene || 2;
  const next = cur + 1;
  showTransition(next, () => {
    const ps   = fbState.players || {};
    const upd  = { readiness:null, 'narration/text':null, 'narration/verdict':null, 'narration/scene':null, 'narration/pendingHp':null, riddleAttempts:null, riddleSolved:null, riddleCorrectCount:null, riddleTotalActive:null, riddleStarted:null, 'session/kragPrep': null, 'session/riddleScoringLock': null };
    upd[`narrationLock/scene${next}`] = null;
    Object.keys(ps).forEach(id => {
    upd[`players/${id}/freeformChoice`] = null;
    upd[`players/${id}/bonusAction`] = null;
    upd[`players/${id}/bonusText`] = null;
      upd[`players/${id}/choice`] = null;
      upd[`players/${id}/choiceId`] = null;
      upd[`players/${id}/choiceSubmitted`] = false;
    });
    if (SCENES[next]) {
      upd['session/currentScene'] = next;
      upd['session/advanceLock']  = null;   // release lock
      upd['session/phase'] = (SCENES[next].type === 'intro' || SCENES[next].type === 'victory') ? 'scene_intro' : 'choosing';
      // Luna reunion — add her to Melissa's inventory at Scene 9
      if (next === 9) {
        const melissaId = Object.keys(ps).find(id => ps[id].archetype === 'Melissa');
        if (melissaId) {
          const inv = [...(ps[melissaId].inventory || [])];
          if (!inv.includes('Luna (companion)')) inv.push('Luna (companion)');
          upd[`players/${melissaId}/inventory`] = inv;
        }
      }
      // Mags' rest stop — revive all downed players at 15 HP and auto-submit for them
      // (they just woke up — they can't browse the shop, but active players still can)
      if (next === 7) {
        Object.keys(ps).forEach(id => {
          if (ps[id].status === 'downed') {
            upd[`players/${id}/hp`]             = 15;
            upd[`players/${id}/status`]          = 'active';
            upd[`players/${id}/choice`]          = 'Revived by Mags — passed on shop';
            upd[`players/${id}/choiceId`]        = 'mags_revived';
            upd[`players/${id}/choiceSubmitted`] = true;
          }
        });
      }
      // Initialize or clear combat state
      if (SCENES[next].combatData) {
        upd['combat/enemyHp']    = SCENES[next].combatData.maxHp;
        upd['combat/maxEnemyHp'] = SCENES[next].combatData.maxHp;
        upd['combat/round']      = 1;
        upd['combat/continues']  = null;
        upd['combat/phase2']     = null;
        upd['combat/history']    = null;
      } else {
        upd['combat/enemyHp']    = null;
        upd['combat/maxEnemyHp'] = null;
        upd['combat/round']      = null;
        upd['combat/continues']  = null;
        upd['combat/phase2']     = null;
        upd['combat/history']    = null;
      }
    } else {
      upd['session/advanceLock'] = null;
      upd['session/phase'] = 'victory_end';
    }
    ROOT.update(upd);
  });
}

function checkAllReady(requiredPhase, callback) {
  ROOT.once('value', snap => {
    const s = snap.val() || {};
    if (s.session?.phase !== requiredPhase) return;
    const ps  = s.players || {};
    const rdy = s.readiness || {};
    if (Object.keys(ps).every(id => rdy[id])) callback(s); // pass fresh snap to callback
  });
}

// ═══════════════════════════════════════════════════════
//  TAUNT SYSTEM
// ═══════════════════════════════════════════════════════
function manageTaunts(phase, players) {
  const el = document.getElementById('tauntEl');
  if (!el) return;

  if (phase !== 'choosing') {    clearInterval(tauntTimer); tauntTimer = null; el.textContent = ''; return;
  }

  const waiting = Object.values(players).filter(p => !p.choiceSubmitted && p.status !== 'downed');
  if (!waiting.length) { el.textContent = ''; return; }

  const show = () => {
    const t    = waiting[Math.floor(Math.random() * waiting.length)];
    const pool = TAUNTS[t.archetype] || TAUNTS.default;
    const msg  = pool[tauntIdx % pool.length].replace('{n}', t.name);
    tauntIdx++;
    el.style.opacity = '0';
    setTimeout(() => { el.textContent = msg; el.style.opacity = '1'; }, 350);
  };

  if (!tauntTimer) { show(); tauntTimer = setInterval(show, 30000); }
}

// ═══════════════════════════════════════════════════════
//  TYPEWRITER EFFECT
// ═══════════════════════════════════════════════════════
function triggerTypewriteIfNeeded(narr) {
  if (!narr.text || !narr.scene) return;
  const key = `s${narr.scene}`;
  if (key === lastNarrKey) return;
  lastNarrKey = key;

  const el = document.getElementById('narrText');
  if (!el) return;
  const full = el.textContent;
  el.textContent = '';
  triggerNarrGlow();
  clearTimeout(typeTimer);

  const CHAR_DELAY = 16; // ms per character — must match across all tabs
  const elapsed = narr.timestamp ? Date.now() - narr.timestamp : 0;
  const startChar = Math.min(Math.floor(elapsed / CHAR_DELAY), full.length);

  // If we're joining late, render everything up to startChar instantly
  if (startChar > 0) {
    el.appendChild(document.createTextNode(full.substring(0, startChar)));
  }

  // If already fully done, show complete text and check achievement
  if (startChar >= full.length) {
    checkForAchievement(full);
    return;
  }

  // Continue typewriter from current position
  const cursor = document.createElement('span');
  cursor.className = 'narr-cursor';
  el.appendChild(cursor);

  let i = startChar;
  const tick = () => {
    if (i < full.length) {
      el.insertBefore(document.createTextNode(full[i++]), cursor);
      typeTimer = setTimeout(tick, CHAR_DELAY);
    } else {
      cursor.remove();
      checkForAchievement(full);
    }
  };
  tick();
}

// ═══════════════════════════════════════════════════════
//  GM PANEL
// ═══════════════════════════════════════════════════════
function renderGMPanel() {
  let bar = document.getElementById('gmBar');
  if (!bar) { bar = document.createElement('div'); bar.id = 'gmBar'; bar.className = 'gm-bar'; document.body.appendChild(bar); }

  const phase  = fbState.session?.phase || '—';
  const scene  = fbState.session?.currentScene || '—';
  const pcnt   = Object.keys(fbState.players||{}).length;

  const keySet = !!sessionStorage.getItem('dcs_apikey');

  bar.innerHTML = `
    <span class="gm-lbl">⚙ GM</span>
    <button class="btn btn-danger btn-sm" onclick="gmReset()">Reset Session</button>
    <span class="gm-sep">|</span>
    <button class="btn btn-sm" onclick="gmForceNext()">Force Next Scene</button>
    <button class="btn btn-sm" onclick="gmForceNarration()">Force Narration</button>
    <span class="gm-sep">|</span>
    <select id="gmJump">
      <option value="">Jump to Scene...</option>
      ${Object.entries(SCENES).map(([n,s])=>`<option value="${n}" ${n==scene?'selected':''}>Scene ${n}: ${s.name}</option>`).join('')}
      ${[4,5,6,7,8,9,10,11].filter(n=>!SCENES[n]).map(n=>`<option value="${n}">Scene ${n} (stub)</option>`).join('')}
    </select>
    <button class="btn btn-sm" onclick="gmJump()">Go</button>
    <span class="gm-sep">|</span>
    ${keySet
      ? `<span style="font-size:0.7rem;color:var(--green-b)">🔑 Key set</span>
         <button class="btn btn-sm" onclick="gmClearKey()">Clear Key</button>`
      : `<input id="gmKeyIn" type="password" placeholder="Paste Anthropic API key..." style="font-family:var(--f-mono);font-size:0.7rem;padding:5px 8px;background:var(--bg-card);border:1px solid var(--red);color:var(--parch);border-radius:2px;width:220px;">
         <button class="btn btn-sm btn-primary" onclick="gmSaveKey()">Set Key</button>`
    }
    ${fbState.session?.collapseDeadline || fbState.session?.collapseRemaining
      ? fbState.session?.collapsePaused
        ? `<span class="gm-sep">|</span><button class="btn btn-sm btn-primary" onclick="gmResumeCollapse()">▶ Resume Timer</button><span style="font-size:0.7rem;color:#cc8030;margin-left:4px;">⏸ ${fmtCollapse(getCollapseMs())} left</span>`
        : `<span class="gm-sep">|</span><button class="btn btn-sm" onclick="gmPauseCollapse()">⏸ Pause Timer</button><span style="font-size:0.7rem;color:var(--sys);margin-left:4px;">${fmtCollapse(getCollapseMs())} left</span>`
      : ''}
    <span class="gm-stat">Phase: ${phase} | Scene: ${scene} | Players: ${pcnt}/4</span>`;
}

function gmReset() {
  if (!confirm('Reset entire session? All players return to archetype selection.')) return;
  const resetToken = 'r_' + Math.random().toString(36).substr(2,9);
  ROOT.remove().then(() => {
    ROOT.set({ session: { active:false, phase:'archetype_selection', resetToken, advanceLock: null, collapseDeadline: null, collapsePaused: null, collapseRemaining: null, collapseArmed: null } });
  });
}

function gmForceNext() {
  const cur  = fbState.session?.currentScene || 1;
  const next = cur + 1;
  const ps   = fbState.players || {};
  const upd  = { 'session/currentScene':next, 'session/phase':'choosing', readiness:null, 'narration/text':null, 'narration/scene':null };
  upd[`narrationLock/scene${next}`] = null;
  Object.keys(ps).forEach(id => {
    upd[`players/${id}/choice`] = null;
    upd[`players/${id}/choiceId`] = null;
    upd[`players/${id}/choiceSubmitted`] = false;
    upd[`players/${id}/freeformChoice`] = null;
    upd[`players/${id}/bonusAction`] = null;
    upd[`players/${id}/bonusText`] = null;
  });
  ROOT.update(upd);
}

function gmForceNarration() {
  const ps  = fbState.players || {};
  const upd = { 'session/phase':'waiting_for_narration' };
  Object.keys(ps).forEach(id => {
    if (!ps[id].choiceSubmitted && ps[id].status !== 'downed') {
      upd[`players/${id}/choice`]          = 'Stood there looking confused';
      upd[`players/${id}/choiceId`]        = 'confused';
      upd[`players/${id}/choiceSubmitted`] = true;
    }
  });
  ROOT.update(upd);
}

function gmSaveKey() {
  const v = document.getElementById('gmKeyIn')?.value.trim();
  if (!v) return;
  sessionStorage.setItem('dcs_apikey', v);
  renderGMPanel();
}

function gmClearKey() {
  sessionStorage.removeItem('dcs_apikey');
  renderGMPanel();
}


function gmJump() {
  const n = parseInt(document.getElementById('gmJump')?.value);
  if (!n) return;
  const ps  = fbState.players || {};
  const scType = SCENES[n]?.type;
  const phase = (scType === 'intro' || scType === 'victory') ? 'scene_intro' : 'choosing';
  const upd = { 'session/currentScene':n, 'session/phase':phase, readiness:null, 'narration/text':null, 'narration/verdict':null, 'narration/scene':null, 'narration/pendingHp':null };
  upd[`narrationLock/scene${n}`] = null;
  Object.keys(ps).forEach(id => {
    upd[`players/${id}/choice`] = null;
    upd[`players/${id}/choiceId`] = null;
    upd[`players/${id}/choiceSubmitted`] = false;
    upd[`players/${id}/freeformChoice`] = null;
    upd[`players/${id}/bonusAction`] = null;
    upd[`players/${id}/bonusText`] = null;
  });
  ROOT.update(upd);
}

// ═══════════════════════════════════════════════════════
//  ANTHROPIC API
// ═══════════════════════════════════════════════════════
async function callClaude(userPrompt, messages = null) {
  const key = sessionStorage.getItem('dcs_apikey');
  if (!key) throw new Error('No API key set. Open the GM panel (?gm=true) and enter your Anthropic API key.');
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1200,
      system: SYS_PROMPT,
      messages: messages || [{ role:'user', content:userPrompt }],
    }),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
  const data = await res.json();
  return data.content?.[0]?.text || '[The System is silent. This is worse.]';
}

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
